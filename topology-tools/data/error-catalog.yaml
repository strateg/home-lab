version: 1
tool: topology-compiler
codes:
  E1001:
    severity: error
    stage: load
    title: Topology File Missing
    hint: Check --topology path and verify the file exists.
  E1002:
    severity: error
    stage: load
    title: Included File Missing
    hint: Fix !include or !include_dir_sorted paths and rerun compilation.
  E1003:
    severity: error
    stage: load
    title: YAML Parse Error
    hint: Fix YAML syntax near the reported line and column.
  E1004:
    severity: error
    stage: load
    title: Invalid Root Type
    hint: Root topology document must be a mapping/object.
  E1201:
    severity: error
    stage: validate
    title: Schema File Missing
    hint: Ensure topology schema exists or pass --schema with a valid path.
  E1202:
    severity: error
    stage: validate
    title: Schema Parse Error
    hint: Fix JSON syntax in schema file.
  E1203:
    severity: error
    stage: validate
    title: Schema Validation Failed
    hint: Update YAML so the compiled structure satisfies the schema.
  E2101:
    severity: error
    stage: resolve
    title: Unresolved Reference
    hint: Point *_ref to an existing id or create the missing object.
  E2102:
    severity: error
    stage: resolve
    title: Duplicate ID
    hint: IDs must be globally unique in the effective topology.
  W2201:
    severity: warning
    stage: resolve
    title: object_ref Without class_ref
    hint: Add class_ref to keep class-object linkage explicit.
  W2202:
    severity: warning
    stage: resolve
    title: class_ref Without object_ref
    hint: Add object_ref for concrete topology or confirm this is abstract topology.
  W2203:
    severity: warning
    stage: resolve
    title: Partial implementation Binding
    hint: implementation.module and implementation.object should be set together.
  E2301:
    severity: error
    stage: load
    title: Profile Map Parse Error
    hint: Fix YAML syntax in --profile-map file.
  E2302:
    severity: error
    stage: load
    title: Profile Map Contract Error
    hint: Validate profile map shape (profiles/profile/instance_overrides).
  W2301:
    severity: warning
    stage: load
    title: Profile Map Missing or Mismatched
    hint: Ensure --profile-map exists and profile name matches requested --profile.
  W2302:
    severity: warning
    stage: load
    title: Empty Profile Overrides
    hint: No overrides resolved for selected profile.
  W2303:
    severity: warning
    stage: resolve
    title: Unknown Profile Override Target
    hint: Remove stale instance override or create missing instance id.
  I2301:
    severity: info
    stage: resolve
    title: Profile Applied
    hint: Profile overrides were applied to the effective topology.
  E2401:
    severity: error
    stage: load
    title: model.lock Parse Error
    hint: Fix YAML syntax in model.lock.
  E2402:
    severity: error
    stage: load
    title: model.lock Contract Error
    hint: model.lock root must be a mapping/object.
  E2403:
    severity: error
    stage: validate
    title: object-class Pin Mismatch
    hint: Align instance class_ref with object pin class_ref in model.lock.
  W2401:
    severity: warning
    stage: load
    title: model.lock Missing
    hint: Create model.lock or disable with --model-lock \"\" for exploratory runs.
  W2402:
    severity: warning
    stage: validate
    title: Unpinned Class Reference
    hint: Add class_ref pin under model.lock classes/class_modules.
  W2403:
    severity: warning
    stage: validate
    title: Unpinned Object Reference
    hint: Add object_ref pin under model.lock objects/object_modules.
  W2404:
    severity: warning
    stage: validate
    title: Empty model.lock Pins
    hint: model.lock should define class and/or object pin maps.
  I2401:
    severity: info
    stage: load
    title: model.lock Loaded
    hint: No action required.
  E3201:
    severity: error
    stage: validate
    title: Semantic Validation Failed
    hint: Fix semantic contract violation reported by validator checks.
  W3201:
    severity: warning
    stage: validate
    title: Semantic Validation Warning
    hint: Review warning and update topology if it indicates drift.
  E3001:
    severity: error
    stage: emit
    title: Effective JSON Emit Failed
    hint: Check output path permissions and free disk space.
  E3901:
    severity: error
    stage: generate
    title: Artifact Manifest Input Missing
    hint: Ensure generator plugins publish existing generated_files entries before artifact manifest finalize.
  I3901:
    severity: info
    stage: generate
    title: Artifact Manifest Generated
    hint: No action required.
  # Ansible Role Generator (ADR 0104)
  I3101:
    severity: info
    stage: generate
    title: Ansible Role Assignment Found
    hint: No action required.
  I3102:
    severity: info
    stage: generate
    title: Ansible Role Artifacts Generated
    hint: No action required.
  I3103:
    severity: info
    stage: generate
    title: Ansible Role Generation Summary
    hint: No action required.
  I9001:
    severity: info
    stage: emit
    title: Compile Success
    hint: No action required.
  # Plugin system errors (ADR 0063)
  E4001:
    severity: error
    stage: load
    title: Plugin Manifest Parse Error
    hint: Fix YAML syntax in plugin manifest file.
  E4002:
    severity: error
    stage: load
    title: Plugin Manifest Schema Error
    hint: Ensure manifest has required fields (id, kind, entry, api_version, stages, order).
  E4003:
    severity: error
    stage: load
    title: Plugin API Version Incompatible
    hint: Update plugin to compatible API version or upgrade kernel.
  E4004:
    severity: error
    stage: load
    title: Plugin Entry Point Not Found
    hint: Check plugin entry path and class name exist.
  E4005:
    severity: error
    stage: load
    title: Plugin Class Invalid
    hint: Plugin class must inherit from PluginBase.
  E4006:
    severity: error
    stage: load
    title: Plugin Kind Mismatch
    hint: Plugin class kind() must match manifest declaration.
  E4007:
    severity: error
    stage: load
    title: Plugin Dependency Missing
    hint: Install or register required dependency plugin.
  E4008:
    severity: error
    stage: load
    title: Plugin Circular Dependency
    hint: Remove circular depends_on references between plugins.
  E4009:
    severity: error
    stage: load
    title: Duplicate Plugin ID
    hint: Plugin IDs must be globally unique across all manifests.
  E4010:
    severity: error
    stage: validate
    title: Plugin Capability Mismatch
    hint: Add capability-providing plugins or update requires_capabilities declarations.
  E4011:
    severity: error
    stage: validate
    title: Unsupported Model Version
    hint: Update model.lock core_model_version or kernel supported model_versions compatibility matrix.
  E4012:
    severity: error
    stage: validate
    title: Model Version Context Missing
    hint: Ensure model.lock is loaded and core_model_version is defined when plugin declares model_versions.
  E4101:
    severity: error
    stage: validate
    title: Plugin Execution Failed
    hint: Check plugin error output and fix reported issue.
  E4102:
    severity: error
    stage: validate
    title: Plugin Crashed
    hint: Plugin raised unhandled exception; check traceback.
  E4103:
    severity: error
    stage: validate
    title: Plugin Timeout
    hint: Plugin exceeded its configured timeout. Increase timeout in manifest or optimize plugin execution.
  W4001:
    severity: warning
    stage: load
    title: No Plugins Loaded
    hint: No plugin manifests found; using core-only validation.
  W4301:
    severity: warning
    stage: validate
    title: Capability Data Unavailable
    hint: Ensure compile stage runs before validate stage with compiler plugins.
  W4302:
    severity: warning
    stage: validate
    title: Missing Required Capabilities
    hint: Add required capabilities to object definition or update class requirements.
  I4001:
    severity: info
    stage: load
    title: Plugins Loaded
    hint: No action required.
  I4002:
    severity: info
    stage: load
    title: Plugin Execution Trace Written
    hint: Trace file emitted for stage/phase/plugin execution debugging.
  I4013:
    severity: info
    stage: validate
    title: Plugin Skipped by Predicate
    hint: Plugin when-predicate evaluated to false for current context.
  I4201:
    severity: info
    stage: compile
    title: Capabilities Derived
    hint: No action required.
  I4210:
    severity: info
    stage: compile
    title: MikroTik Capability Flags Derived
    hint: >-
      object.mikrotik.compiler.capability_flags derived conditional-generation flags
      (W07 migration order item 1). No action required.
  I4211:
    severity: info
    stage: compile
    title: MikroTik WireGuard Tunnels Derived
    hint: >-
      object.mikrotik.compiler.wireguard_tunnels derived tunnel/interface/peer shape
      (W07 migration order item 4a). No action required.
  I4212:
    severity: info
    stage: compile
    title: MikroTik Containers Derived
    hint: >-
      object.mikrotik.compiler.containers derived container attachment/publication
      shape (W07 migration order item 4b). No action required.
  I4213:
    severity: info
    stage: compile
    title: MikroTik WiFi Config Derived
    hint: >-
      object.mikrotik.compiler.wifi_config derived interface/VLAN membership shape
      (W07 migration order item 4c). No action required.
  I4214:
    severity: info
    stage: compile
    title: MikroTik Routing Policies Derived
    hint: >-
      object.mikrotik.compiler.routing_policies derived policy-based routing shape
      (W07 migration order item 4d). No action required.
  I4215:
    severity: info
    stage: compile
    title: MikroTik MAC-to-VLAN Assignments Derived
    hint: >-
      object.mikrotik.compiler.mac_vlan_assignments derived MAC-to-VLAN assignment
      shape (W07 migration order item 4e). No action required.
  I4216:
    severity: info
    stage: compile
    title: MikroTik Bridge VLANs Derived
    hint: >-
      object.mikrotik.compiler.bridge_vlans derived bridge-VLAN membership
      shape (W07 migration order item 4f). No action required.
  I4217:
    severity: info
    stage: compile
    title: MikroTik VLAN Entries Derived
    hint: >-
      object.mikrotik.compiler.vlan_entries derived VLAN row -> rendered
      shape (W07 migration order item 4g). No action required.
  I4218:
    severity: info
    stage: compile
    title: MikroTik Bridge Entries Derived
    hint: >-
      object.mikrotik.compiler.bridge_entries derived bridge row -> rendered
      shape (W07 migration order item 4h). No action required.
  I4219:
    severity: info
    stage: compile
    title: MikroTik Firewall Entries Derived
    hint: >-
      object.mikrotik.compiler.firewall_entries derived firewall-policy row
      -> rendered shape (W07 migration order item 4i). No action required.
  I4301:
    severity: info
    stage: validate
    title: Capability Validation Started
    hint: No action required.
  W8001:
    severity: warning
    stage: validate
    title: Undeclared Published Keys
    hint: Add produces[] declarations for runtime-published keys.
  W8002:
    severity: warning
    stage: validate
    title: Published Keys Not in Produces
    hint: Align published keys with manifest produces[] contract.
  W8003:
    severity: warning
    stage: validate
    title: Undeclared Consumed Keys
    hint: Add consumes[] declarations for runtime subscribe usage.
  W8004:
    severity: warning
    stage: validate
    title: Consumed Keys Not in Consumes
    hint: Align consumed keys with manifest consumes[] contract.
  E8001:
    severity: error
    stage: validate
    title: Data Bus Schema Reference Invalid
    hint: Ensure schema_ref points to a valid JSON schema file reachable from manifest or tooling root.
  E8002:
    severity: error
    stage: validate
    title: Data Bus Payload Schema Violation
    hint: Update payload shape or schema_ref so published/consumed value satisfies JSON schema contract.
  E8003:
    severity: error
    stage: validate
    title: Required Consumed Payload Missing
    hint: 'Ensure required consumes payload is published before consumer execution or mark consume as required: false.'
  E8004:
    severity: error
    stage: validate
    title: Produced Keys Declaration Missing
    hint: Declare runtime-published keys in produces[] or disable strict contract mode.
  E8005:
    severity: error
    stage: validate
    title: Published Key Not Declared in Produces
    hint: Add missing key to produces[] to satisfy strict contract mode.
  E8006:
    severity: error
    stage: validate
    title: Consumed Keys Declaration Missing
    hint: Declare runtime-consumed keys in consumes[] or disable strict contract mode.
  E8007:
    severity: error
    stage: validate
    title: Consumed Key Not Declared in Consumes
    hint: Add missing key to consumes[] to satisfy strict contract mode.
  E8101:
    severity: error
    stage: assemble
    title: Assembly Input Missing
    hint: Ensure artifact manifest exists and references valid generated files.
  E8102:
    severity: error
    stage: assemble
    title: Assembly Verification Failed
    hint: Fix missing assembled files before build stage runs.
  E8103:
    severity: error
    stage: assemble
    title: Secret Leak Guard Triggered
    hint: Remove secret-like files from assembled workspace or adjust generator outputs.
  E8104:
    severity: error
    stage: assemble
    title: Assembly Manifest Generation Failed
    hint: Ensure assemble.run publishes assembled_files before finalize.
  E8105:
    severity: error
    stage: assemble
    title: Deploy Bundle Assembly Failed
    hint: Ensure generated artifacts and deploy bundle module are available.
  I8101:
    severity: info
    stage: assemble
    title: Workspace Assembled
    hint: No action required.
  I8102:
    severity: info
    stage: assemble
    title: Assembly Verified
    hint: No action required.
  I8103:
    severity: info
    stage: assemble
    title: Assembly Manifest Generated
    hint: No action required.
  I8104:
    severity: info
    stage: assemble
    title: Changed Input Scopes Evaluated
    hint: No action required.
  I8105:
    severity: info
    stage: assemble
    title: Deploy Bundle Assembled
    hint: No action required.
  E8201:
    severity: error
    stage: build
    title: Release Bundle Build Failed
    hint: Ensure assembly manifest files exist and are readable.
  E8202:
    severity: error
    stage: build
    title: SBOM Generation Failed
    hint: Ensure assembly manifest payload is available for build.verify stage.
  E8203:
    severity: error
    stage: build
    title: Release Manifest Generation Failed
    hint: Ensure bundle and SBOM outputs are published before build.finalize.
  I8201:
    severity: info
    stage: build
    title: Release Bundle Generated
    hint: No action required.
  I8202:
    severity: info
    stage: build
    title: SBOM Generated
    hint: No action required.
  I8203:
    severity: info
    stage: build
    title: Release Manifest Generated
    hint: No action required.
  # ADR 0088 semantic keyword registry
  E8801:
    severity: error
    stage: validate
    title: Missing Required Semantic Key
    hint: Provide required canonical semantic key or valid migration alias for current context.
  E8802:
    severity: error
    stage: validate
    title: Semantic Context Violation
    hint: Use semantic key only in the allowed context (entity manifest vs capability entry).
  E8803:
    severity: error
    stage: validate
    title: Semantic Key Collision
    hint: Remove canonical/alias duplicates and keep exactly one semantic key per token.
  E8804:
    severity: error
    stage: validate
    title: Typed Extends Target Mismatch
    hint: Ensure '@extends' points to correct target type (class->class, object->class, instance->object).
  E8805:
    severity: error
    stage: validate
    title: Capability Contract Semantic Violation
    hint: Resolve unknown/duplicate capability IDs and align capability entries with semantic contract.
  E8806:
    severity: error
    stage: load
    title: Strict YAML Duplicate Key
    hint: Remove duplicate mapping keys; strict loader rejects ambiguous YAML mappings.
  E8807:
    severity: error
    stage: validate
    title: Legacy Instance Service Key
    hint: Replace plain 'group' with canonical '@group' in instance shard manifests.
  # ADR 0071 sharded instances loader
  E7101:
    severity: error
    stage: validate
    title: Instance Filename Mismatch
    hint: Rename shard file to <instance>.yaml so basename matches instance id.
  E7102:
    severity: error
    stage: resolve
    title: Duplicate Instance ID in Shards
    hint: Ensure each instance id appears in exactly one shard file.
  E7103:
    severity: error
    stage: validate
    title: Invalid Shard File Shape
    hint: Shard file must contain exactly one instance row (not instance_bindings root).
  E7104:
    severity: error
    stage: validate
    title: Unsupported Instance Schema Version
    hint: 'Use strict shard contract version: 1.0.0; schema_version is no longer supported.'
  E7105:
    severity: error
    stage: load
    title: Reserved Shard File Ingestion Attempt
    hint: Do not treat reserved metadata/helper files as instance shards.
  E7107:
    severity: error
    stage: load
    title: Missing Instance Source Configuration
    hint: Configure project manifest instances_root for selected source mode.
  # ADR 0068 placeholder validation
  E6801:
    severity: error
    stage: validate
    title: Invalid Placeholder Syntax
    hint: Use @required:<format> or @optional:<format> with a format from instance-field-formats.yaml.
  E6802:
    severity: error
    stage: validate
    title: Required Override Missing
    hint: Add missing required placeholder values under instance_overrides.
  E6803:
    severity: error
    stage: validate
    title: Override Path Not Marked
    hint: Override only fields marked with @required or @optional in object template.
  E6804:
    severity: error
    stage: validate
    title: Override Path Not Found
    hint: Ensure instance_overrides path exists in object template.
  E6805:
    severity: error
    stage: validate
    title: Override Format Validation Failed
    hint: Provide value that matches declared placeholder format.
  E6806:
    severity: error
    stage: validate
    title: Unresolved Placeholder After Merge
    hint: Ensure required placeholders are overridden and optional placeholders are omitted or resolved.
  E6807:
    severity: error
    stage: validate
    title: Plaintext Value for Secret Placeholder
    hint: Secret-annotated fields must be resolved via SOPS sidecar secrets, not provided as plaintext in instance or override files.
  # ADR 0069 pipeline mode and parity controls
  E6901:
    severity: error
    stage: validate
    title: Pipeline Mode Misconfiguration
    hint: plugin-first mode requires compiler plugins to publish compiled_json and required compile outputs.
  E6903:
    severity: error
    stage: validate
    title: Compiled Model Contract Violation
    hint: Ensure compiled_json contains required metadata keys and supported compiled_model_version.
  E6904:
    severity: error
    stage: validate
    title: Legacy Pipeline Retired
    hint: Use --pipeline-mode plugin-first; legacy execution path is disabled.
  E6905:
    severity: error
    stage: validate
    title: Parity Gate Retired
    hint: Remove --parity-gate; parity checks were retired after plugin-first cutover.
  # ADR 0062 planned cross-layer storage relations
  E7401:
    severity: error
    stage: validate
    title: Storage Relation Target Not Found
    hint: Ensure storage.pool_ref/storage.volume_ref points to an existing L3 storage instance.
  E7402:
    severity: error
    stage: validate
    title: Storage Relation Target Invalid
    hint: storage.pool_ref must target class.storage.pool; storage.volume_ref must target class.storage.volume.
  E7403:
    severity: error
    stage: validate
    title: Storage Relation Source Layer Invalid
    hint: storage.pool_ref is allowed from L4 only; storage.volume_ref is allowed from L5 only.
  E7404:
    severity: error
    stage: validate
    title: Storage Relation Reference Format Invalid
    hint: storage.pool_ref/storage.volume_ref must be non-empty string instance ids.
  # ADR 0062 planned cross-layer network relations
  E7501:
    severity: error
    stage: validate
    title: Network Relation Target Not Found
    hint: Ensure network.bridge_ref points to an existing L2 network instance.
  E7502:
    severity: error
    stage: validate
    title: Network Relation Target Invalid
    hint: network.bridge_ref must target class.network.bridge on L2.
  E7503:
    severity: error
    stage: validate
    title: Network Relation Source Layer Invalid
    hint: network.bridge_ref is allowed from L4 source instances only.
  E7504:
    severity: error
    stage: validate
    title: Network Relation Reference Format Invalid
    hint: network.bridge_ref must be a non-empty string instance id.
  E7511:
    severity: error
    stage: validate
    title: VLAN Relation Target Not Found
    hint: Ensure network.vlan_ref points to an existing L2 VLAN instance.
  E7512:
    severity: error
    stage: validate
    title: VLAN Relation Target Invalid
    hint: network.vlan_ref must target class.network.vlan on L2.
  E7513:
    severity: error
    stage: validate
    title: VLAN Relation Source Layer Invalid
    hint: network.vlan_ref is allowed from L1 and L4 source instances only.
  E7514:
    severity: error
    stage: validate
    title: VLAN Relation Reference Format Invalid
    hint: network.vlan_ref must be a non-empty string instance id.
  E7601:
    severity: error
    stage: validate
    title: Observability Target Not Found
    hint: Ensure observability.target_ref points to an existing L1/L4/L5 instance.
  E7602:
    severity: error
    stage: validate
    title: Observability Target Invalid
    hint: observability.target_ref must target allowed layers L1/L4/L5.
  E7603:
    severity: error
    stage: validate
    title: Observability Source Layer Invalid
    hint: observability.target_ref is allowed from L6 source instances only.
  E7604:
    severity: error
    stage: validate
    title: Observability Target Reference Format Invalid
    hint: observability.target_ref must be a non-empty string instance id.
  E7701:
    severity: error
    stage: validate
    title: Operations Target Not Found
    hint: Ensure operations.target_ref points to an existing L1/L4/L5/L6 instance.
  E7702:
    severity: error
    stage: validate
    title: Operations Target Invalid
    hint: operations.target_ref must target allowed layers L1/L4/L5/L6.
  E7703:
    severity: error
    stage: validate
    title: Operations Source Layer Invalid
    hint: operations.target_ref is allowed from L7 source instances only.
  E7704:
    severity: error
    stage: validate
    title: Operations Target Reference Format Invalid
    hint: operations.target_ref must be a non-empty string instance id.
  # ADR 0062 planned L1 power source relation
  E7801:
    severity: error
    stage: validate
    title: Power Source Target Not Found
    hint: Ensure power.source_ref points to an existing L1 power-source instance.
  E7802:
    severity: error
    stage: validate
    title: Power Source Target Invalid
    hint: power.source_ref must target class.power.pdu or class.power.ups on L1.
  E7803:
    severity: error
    stage: validate
    title: Power Source Source Layer Invalid
    hint: power.source_ref is allowed from L1 source instances only.
  E7804:
    severity: error
    stage: validate
    title: Power Source Reference Format Invalid
    hint: power.source_ref and optional power.outlet_ref must be non-empty strings.
  E7805:
    severity: error
    stage: validate
    title: Power Source Constraint Violation
    hint: Resolve self-reference, cycle, or duplicate outlet occupancy in power wiring.
  E7808:
    severity: error
    stage: validate
    title: Legacy Paths Contract Unsupported
    hint: Remove legacy paths section and use framework/project manifest contract.
  # ADR 0075/0076 framework-project compatibility (reserved for staged adoption)
  E7811:
    severity: error
    stage: validate
    title: Framework Version Too Old
    hint: Upgrade framework to satisfy project_min_framework_version from project manifest.
  E7812:
    severity: error
    stage: validate
    title: Project Schema Not Supported
    hint: Upgrade framework runtime or migrate project manifest schema version.
  E7813:
    severity: error
    stage: validate
    title: Contract Migration Required
    hint: Run project contract migrator before compiling with current strict runtime.
  E7821:
    severity: error
    stage: load
    title: Framework Dependency Not Resolvable
    hint: Check framework source path, URL, or dependency fetch policy.
  E7822:
    severity: error
    stage: load
    title: Framework Lock Missing
    hint: Generate framework.lock.yaml and commit it before strict verification.
  E7823:
    severity: error
    stage: validate
    title: Framework Lock Revision Mismatch
    hint: Lock revision differs from current framework revision; update lock or checkout matching revision.
  E7824:
    severity: error
    stage: validate
    title: Framework Integrity Hash Mismatch
    hint: Lock integrity hash does not match framework files; regenerate lock from trusted source.
  E7825:
    severity: error
    stage: validate
    title: Framework Signature Missing or Invalid
    hint: Provide valid signature metadata for package-based framework source.
  E7826:
    severity: error
    stage: validate
    title: Framework Provenance Missing
    hint: Provide provenance attestation metadata for package-based framework source.
  E7827:
    severity: error
    stage: validate
    title: Framework Lock Contract Violation
    hint: Fix framework.lock.yaml schema/fields to match contract.
  E7828:
    severity: error
    stage: validate
    title: Framework SBOM Missing
    hint: Provide SBOM metadata for package-based framework source.
  I7829:
    severity: info
    stage: validate
    title: Framework Lock Auto-Regenerated
    hint: Dev profile automatically regenerated framework.lock.yaml due to integrity mismatch.
  # ADR 0089/0091 SOHO product profile and readiness contracts
  E7941:
    severity: error
    stage: validate
    title: SOHO Product Profile Invalid
    hint: Fix product_profile fields and supported profile_id/deployment_class values.
  E7942:
    severity: error
    stage: validate
    title: SOHO Required Bundle Missing
    hint: Add required product_bundles for the selected profile/deployment_class.
  E7943:
    severity: error
    stage: build
    title: SOHO Backup Evidence Missing
    hint: Provide backup-status evidence for ADR0091 readiness package.
  E7944:
    severity: error
    stage: build
    title: SOHO Restore Evidence Missing
    hint: Provide restore-readiness evidence for ADR0091 readiness package.
  E7945:
    severity: error
    stage: build
    title: SOHO Handover Package Incomplete
    hint: Ensure required product/handover artifacts are present.
  E7946:
    severity: error
    stage: build
    title: SOHO Deployment Class Unsupported
    hint: Use supported deployment_class values only (starter|managed-soho|advanced-soho).
  E7947:
    severity: error
    stage: validate
    title: SOHO Migration State Transition Invalid
    hint: Use allowed migration transitions only (legacy -> migrated-soft -> migrated-hard).
  E7948:
    severity: error
    stage: validate
    title: SOHO Legacy Migration Sunset Enforced
    hint: Legacy mode is past sunset date; define product_profile and migrate to migrated-soft/migrated-hard.
  W7941:
    severity: warning
    stage: validate
    title: SOHO Product Profile Missing
    hint: Add product_profile to move from legacy state to migrated governance modes.
  W7942:
    severity: warning
    stage: validate
    title: SOHO Bundles Incomplete in Soft Migration
    hint: Complete required bundles before promoting migration_state to migrated-hard.
  I7941:
    severity: info
    stage: build
    title: SOHO Readiness Package Emitted
    hint: SOHO operator handover and readiness reports were emitted.
  I6901:
    severity: info
    stage: validate
    title: Pipeline Mode Activated
    hint: Plugin-first effective model source is active.
  # ADR 0103 Terraform State Reconciliation
  E8300:
    severity: error
    stage: build
    title: Terraform State File Not Found
    hint: Ensure terraform.tfstate exists at configured path or run terraform apply.
  E8301:
    severity: error
    stage: build
    title: Terraform State File Unreadable
    hint: Check file permissions and path validity for tfstate file.
  E8310:
    severity: error
    stage: build
    title: Invalid Terraform State JSON
    hint: Verify tfstate file is valid JSON; may be corrupted or truncated.
  E8311:
    severity: error
    stage: build
    title: Unsupported Terraform Version
    hint: Reconciler requires Terraform state version 4; upgrade or downgrade TF.
  E8320:
    severity: error
    stage: build
    title: No Resource Match for Instance
    hint: Add managed_by field to instance or verify naming convention matches.
  E8321:
    severity: error
    stage: build
    title: Ambiguous Resource Match
    hint: Multiple TF resources match instance; add explicit managed_by to disambiguate.
  W8350:
    severity: warning
    stage: build
    title: Terraform State File Stale
    hint: State file is older than 24 hours; consider running terraform refresh.
  W8351:
    severity: warning
    stage: build
    title: Partial Reconciliation Coverage
    hint: Some instances have no matching Terraform state; use CLI mode for full reconciliation.
  I8380:
    severity: info
    stage: build
    title: Reconciliation Complete
    hint: No action required.
  I8381:
    severity: info
    stage: build
    title: Resources Matched
    hint: No action required.
  # ADR 0097 Instance Rows Pipeline Fallback Observability
  I7950:
    severity: info
    stage: compile
    title: Secret Resolved Rows Fallback
    hint: Instance rows compiler using legacy fallback path due to unavailable or invalid publication.
  I7951:
    severity: info
    stage: compile
    title: Resolved Rows Fallback
    hint: Instance rows compiler using legacy fallback path due to unavailable or invalid publication.
  I7952:
    severity: info
    stage: compile
    title: Prepared Rows Fallback
    hint: Instance rows compiler using legacy fallback path due to unavailable or invalid publication.
  I7953:
    severity: info
    stage: compile
    title: Validated Rows Fallback
    hint: Instance rows compiler using legacy fallback path due to unavailable or invalid publication.

  # ---------------------------------------------------------------------------
  # ADR 0118 / ADR 0119 - Universal Container Network Model.
  #
  # Range E70xx/W70xx/I70xx, allocated 2026-09-11 at gate G1. ADR 0118 D7
  # withdrew the numeric ranges first suggested there and required allocation
  # "with a collision test" at implementation time. The check that justified this
  # block: E70xx was the only band inside the E7xxx core range with no code
  # claimed by source, catalog, ADR or documentation. E78xx, where ADR 0110 and
  # ADR 0111 live, is 93/100 occupied and cannot take another family.
  #
  # Each code below names a rule the reference model already enforces or an
  # obligation the ADR 0119 formal contract states. Codes reserved for a rule
  # nobody has written are deliberately absent: a speculative table is what D7
  # rejected.
  # ---------------------------------------------------------------------------

  # Schema and shape (NET-* authoring surface)
  E7001:
    severity: error
    stage: validate
    title: Unknown Key In Network Intent
    hint: Remove the key or declare it in the owning class schema; a v2 block admits only declared keys.
  E7002:
    severity: error
    stage: validate
    title: Invalid Record Key
    hint: Record keys must match ^[A-Za-z_][A-Za-z0-9_]*$; no dot, hyphen or '@', so a reference path stays unambiguous.
  E7003:
    severity: error
    stage: validate
    title: Derived Field Authored
    hint: This field is derived from the referenced domain; remove it rather than restating a value that must agree.
  E7004:
    severity: error
    stage: validate
    title: Mixed Schema Versions
    hint: One effective source uses one version; do not mix a v1 flat network block with v2 attachments.
  E7005:
    severity: error
    stage: validate
    title: Required Field Missing In Network Record
    hint: Supply the field the class schema marks required; an absent value is not a permissive default.
  E7006:
    severity: error
    stage: validate
    title: Unsupported Network Schema Version
    hint: schema_version must be a version this framework declares; it is not the ADR 0088 manifest token.
  E7007:
    severity: error
    stage: validate
    title: Network Intent Validator Prerequisite Missing
    hint: >-
      The validator could not obtain normalized instance rows, so it checked nothing. Kept distinct from E7005
      because "the check did not run" and "a field is missing" are different facts and a silent pass is neither.
  E7008:
    severity: error
    stage: validate
    title: Security Plan Validator Prerequisite Missing
    hint: >-
      The validator could not obtain the published security plan, so it checked nothing. Distinct from E7007:
      both say a check did not run, but they name different missing producers, and a reader needs to know which.

  # Enforcer/scope attribution (ADR 0119 D1.1), allocated 2026-09-28 in the
  # unclaimed 7009-7019 sub-band of this range.
  E7010:
    severity: error
    stage: compile
    title: Scope Declares No Enforcer
    hint: >-
      A security matrix has no managed_by_ref, so no enforcer is attributed to it and it is enforced by
      nobody. status: disabled is the one declared exemption; there is no other silent skip.
  E7011:
    severity: error
    stage: compile
    title: Scope Declares No Enforcement Plane
    hint: >-
      Neither the instance nor its object supplies enforcement_plane, which the class schema requires.
      Replaces a prior silent default to perimeter.
  W7012:
    severity: warning
    stage: compile
    title: Enforcer Holds Several Scopes
    hint: >-
      One enforcer names more than one scope. ADR 0119 D1.1 permits this; it is reported because no current
      adapter renders more than one scope per enforcer, not because the model forbids the multiplicity.
  E7013:
    severity: error
    stage: compile
    title: Scope Zone Overlaps Another On The Same Enforcer
    hint: >-
      Two scopes attributed to one enforcer name the same zone_ref. Scopes composed for one enforcer must
      have pairwise-disjoint zone_refs (D-COMP-1); no composed plan is published for that enforcer.
  E7014:
    severity: error
    stage: compile
    title: Policy Override Name Collides Across Scopes On The Same Enforcer
    hint: >-
      Two scopes attributed to one enforcer declare a policy_overrides entry with the same name, which would
      collide at the same rendered resource address (D-COMP-2); no composed plan is published for that enforcer.

  # Enforcer type/adapter resolution (ADR 0118/0119 D-TYPE-1..3), allocated
  # 2026-09-29 in the same 7009-7019 sub-band, after SPC MODE review.
  #
  # W7015/W7016/W7017/W7019 are warnings, not errors: they fire during
  # per-instance resolution for ANY instance declaring a device-kind
  # capability, whether or not anything actually uses it as an enforcer
  # (e.g. a zone-policy-capable device with no managed_by_ref pointing at
  # it yet). An unreferenced, unresolved instance is latent, not a build
  # failure. E7018 is the one enforced error, because it fires only for an
  # instance an actual security_matrix scope depends on via managed_by_ref.
  W7015:
    severity: warning
    stage: compile
    title: Instance Declares Both Enforcer Device Kinds
    hint: >-
      An instance's effective capabilities include both cap.net.l3.security.firewall.zone_policy and
      cap.compute.security.firewall.zone_policy. Enforcer type is exactly one device kind (D-TYPE-1);
      resolution refuses rather than picking one.
  W7016:
    severity: warning
    stage: compile
    title: Enforcer Type Has No Compatible Adapter
    hint: >-
      An instance's resolved enforcer type has no adapter for its OS family, and it declares no direct
      adapter capability either (D-TYPE-2). Unsupported combination, not a silent no-op.
  W7017:
    severity: warning
    stage: compile
    title: Enforcer Type Has More Than One Compatible Adapter
    hint: >-
      More than one OS family resolves an adapter for one instance's enforcer type (D-TYPE-2). No priority
      order between them; ambiguous. Registered though unreachable under the current OS-family table, so it
      stays caught if that table ever grows.
  E7018:
    severity: error
    stage: compile
    title: Scope's Enforcer Has No Resolved Type
    hint: >-
      A security matrix's managed_by_ref names an instance whose derived enforcer type is none (D-TYPE-1).
      Replaces the disabled generic class.router target-class check for class.network.security_matrix.
  E7019:
    severity: error
    stage: validate
    title: Network Row's Enforcer Is Not A Network-Type Device
    hint: >-
      A class.network.vlan or class.network.routing_policy row's managed_by_ref names a class.router/L1
      instance whose derived enforcer type (D-TYPE-1) is not "network" - strict, unlike E7018/E7026's
      permissive (network-or-compute) check. Added alongside the existing class.router/L1 structural check
      (E7835).
  W7019:
    severity: warning
    stage: compile
    title: Direct Adapter Declaration Disagrees With OS-Family Resolution
    hint: >-
      An instance declares an adapter capability directly (cap.firewall.security_matrix.routeros or .pve)
      that differs from the adapter its OS family resolves to (D-TYPE-2 reconciliation). Both are inputs to
      the resolution per ADR 0119 D1.1; neither is preferred by priority.
  E7026:
    severity: error
    stage: validate
    title: Firewall Policy's Enforcer Has No Resolved Type
    hint: >-
      A class.network.firewall_policy row's managed_by_ref names an instance whose derived enforcer type
      (D-TYPE-1) is none. Permissive like E7018 (network or compute both accepted, ADR-0110), unlike
      E7019's VLAN/routing_policy-only network requirement. class.network.firewall_policy has no structural
      class.router/L1 check to layer onto - excluded from the generic path for the same reason
      class.network.security_matrix is.
  E7027:
    severity: error
    stage: compile
    title: Network Row's Managed-By Target Is Ambiguous
    hint: >-
      A VLAN, bridge, firewall-policy, routing-policy or MAC-VLAN-assignment row has no managed_by_ref
      (and, where applicable, no matching ip_allocations/host_ref fallback), with zero or several candidate
      MikroTik routers present. V-10 (ENFORCER-AXIS-CONFORMANCE.md): a channel that cannot represent this
      multiplicity refuses it with a diagnostic (ADR 0119 D1) instead of silently dropping the row.

  # Attachment and address domain (NET-ATTACHMENT, NET-ADDRESS-OWNER)
  E7020:
    severity: error
    stage: validate
    title: Attachment References Unknown Address Domain
    hint: network_ref must name a modeled address domain; an unmodeled network is refused, never guessed.
  E7021:
    severity: error
    stage: validate
    title: Multiple Default Routes In One Scope
    hint: At most one default route per address family and routing domain unless an explicit multipath contract exists.
  E7022:
    severity: error
    stage: validate
    title: Address Allocation Conflict
    hint: Two attachments claim one host offset in the same domain; host is an offset from the network address, not a last octet.
  E7023:
    severity: error
    stage: validate
    title: Address Domain Has No Prefix For Family
    hint: The referenced domain declares no prefix for the requested address family; declare it on the domain.
  E7024:
    severity: error
    stage: validate
    title: Address Offset Outside Domain
    hint: >-
      The host offset does not exist in the referenced prefix. host counts from the network address, so the
      usable range is 1..(size - 2) for an IPv4 prefix that has a broadcast address.

  # Publication (delivery, never authorization)
  E7025:
    severity: error
    stage: validate
    title: Reference To A Disabled Record
    hint: >-
      A reference names a record whose `enabled` is explicitly false. The declarations say an explicit false
      disables an inherited record without deleting it, so a reference to it is an error rather than a silent
      miss - and reporting it as "no such record" would send the author looking for a typo.
  E7040:
    severity: error
    stage: validate
    title: Publication Endpoint Not An Attachment
    hint: endpoint_ref must name an attachment on the workload this service runs on.
  E7041:
    severity: error
    stage: validate
    title: Publication Port Conflict
    hint: Two publications claim one protocol and port on one endpoint.
  E7042:
    severity: error
    stage: validate
    title: Publication Mechanism Unsupported
    hint: The enforcing capability does not offer this delivery mechanism; a translating mechanism is not a substitute.

  # Policy and binding (NET-POLICY-BINDING, SEC-AUTH authoring)
  E7060:
    severity: error
    stage: validate
    title: Policy Mode Outside Baseline Profile
    hint: The baseline admits permit/binding_only and deny/scope_guard; any other pairing has no defined meaning.
  E7061:
    severity: error
    stage: validate
    title: Binding Target Invalid
    hint: A binding must reference an existing permit template; a scope guard is activated by its scope and binds nothing.
  E7062:
    severity: error
    stage: validate
    title: Unapproved Binding Used As Authorization
    hint: An unapproved candidate never authorizes traffic; owner and rationale are review material, not approval.
  E7063:
    severity: error
    stage: validate
    title: Permit Overlaps Mandatory Deny
    hint: Resolve the contradiction in the sources; the compiler will not trim a permit to fit a guard.
  E7064:
    severity: error
    stage: validate
    title: Empty Resolved Selector
    hint: An empty resolved set is an error, not 'any'; a placeholder is a parameter a binding fills, never a wildcard.

  # Plan, order and the ADR 0119 obligations
  E7080:
    severity: error
    stage: generate
    title: Precedence Cycle
    hint: SEC-ORDER; the rules named in the message require each other to come first. A terminal deny is a role, not an effect.
  E7081:
    severity: error
    stage: generate
    title: Order Violates Required Edge
    hint: SEC-ORDER; the emitted plan breaks a precedence edge it claims to satisfy.
  E7082:
    severity: error
    stage: generate
    title: Terminal Default Deny Missing
    hint: >-
      A default-allow backend requires a terminal drop-all closing the scope. Replaces the E7854 that ADR 0110
      assigned in 2026-06 to a code already held since 2026-03 by storage media inventory; see the erratum in
      docs/diagnostics-catalog.md.
  E7083:
    severity: error
    stage: validate
    title: Delivery Without Authorization
    hint: SEC-AUTH; accepted delivery whose original intent is not in the authorized set.
  E7084:
    severity: error
    stage: validate
    title: Required Flow Not Admitted
    hint: SEC-AVAIL; a declared required flow fails under healthy prerequisites. An all-drop plan is not safe, it is broken.
  E7085:
    severity: error
    stage: validate
    title: Path Bypasses Verified Gate
    hint: SEC-PATH; a feasible in-scope path crosses no adequate gate and is not demonstrably disabled.
  E7086:
    severity: error
    stage: validate
    title: Transform Merges Distinct Authorizations
    hint: SEC-NAT; a composed transform collapses differently authorized originals into one.
  E7087:
    severity: error
    stage: validate
    title: Session Survives Revocation Deadline
    hint: SEC-STATE; established or related traffic outlives the active epoch's declared deadline.
  E7088:
    severity: error
    stage: validate
    title: Unapproved Intermediate Transition
    hint: SEC-TRANSITION; a partial apply, retry, reboot or rollback state admits a transition outside the approved set.
  E7094:
    severity: error
    stage: validate
    title: Unsupported Predicate Semantics
    hint: >-
      A selector uses a shape the bounded algebra does not implement - a range, a negation, a CIDR condition or
      an unknown protocol token. Refused rather than approximated: the probe classes that make the semantic
      check meaningful are derived from the shapes it supports, so lowering an unsupported one produces a plan
      the checks cannot see past.
  E7095:
    severity: error
    stage: validate
    title: Unknown Endpoint In Plan
    hint: >-
      A rule names an endpoint no source declares. The endpoint set is closed by contract because the probe
      space enumerates it: an endpoint outside it is not merely undeclared, it is outside every check.
  E7096:
    severity: error
    stage: validate
    title: Execution Does Not Terminate
    hint: >-
      A flow inside the declared scope reaches no rule at all. Not an accept and not a deny - the outcome
      belongs to whatever the backend does by default, which on a default-allow enforcer is an open flow.
      Reachable termination is its own obligation and is not derived from anybody declaring an availability
      objective; it is also not repaired by reading an unmatched flow as a deny, which would credit the plan
      with a rule it does not carry.
  E7097:
    severity: error
    stage: validate
    title: Partial Verification Belongs To Another Plan
    hint: >-
      A partial verification record carries the identity of the plan it examined, and this one names a
      different plan. Merging it under the current plan's digest would certify a check nobody ran against
      that plan - and recomputing its digest would not repair it, because the verdict inside was reached
      about something else.
  E7093:
    severity: error
    stage: validate
    title: Plan Does Not Carry A Source Permit
    hint: >-
      A permit the source states has no rule in the plan. This is lowering incompleteness, reported separately
      from availability: nothing declared that the flow must keep working, so it is not a SEC-AVAIL failure,
      and a plan that silently represents less than the source states is still wrong.
  E7092:
    severity: error
    stage: validate
    title: Required Flow Contradicts A Mandatory Deny
    hint: >-
      A declared availability requirement names a flow a mandatory deny forbids, so Q is not a subset of A.
      This blocks the model: it is a contradiction between two source statements for a person to resolve, and
      it must never be settled by weakening the guard or by dropping the requirement.
  E7090:
    severity: error
    stage: validate
    title: Plan Does Not Carry A Source Restriction
    hint: >-
      A mandatory deny the source states has no rule in the plan. Behavioural equivalence does not cover this:
      a terminal deny can make the final verdict identical while the restriction itself is gone, so coverage is
      traced against the source rather than inferred from the outcome.
  E7091:
    severity: error
    stage: validate
    title: Plan Omits A Declared Scope
    hint: >-
      A scope the sources declare has no representation in the plan. An absent scope cannot be reported as
      unterminated or incomplete, so its omission would otherwise hide itself.
  E7089:
    severity: error
    stage: validate
    title: Capability Requirement Without Witness
    hint: >-
      SEC-CAP; an applicable requirement has no scoped satisfaction witness at the evidence level the claim needs.
      Missing evidence is 'not run', never pass.

  W7002:
    severity: warning
    stage: validate
    title: Availability Requirements Not Declared
    hint: >-
      No availability requirement is declared for this scope, so SEC-AVAIL is unverified rather than satisfied.
      A permit is permission and not an objective: deriving required flows from permits would invent an
      availability claim nobody made, and then report it as met.
  W7003:
    severity: warning
    stage: validate
    title: Obligation Applies And Cannot Be Decided
    hint: >-
      The plan carries a construct this obligation governs and the input needed to decide it is absent. The
      missing input is named in the message. Reported as unverified rather than satisfied - nothing is known
      to be wrong, and nothing is known to be right either - and strict admission refuses it exactly as it
      refuses a failure, because "nobody checked" is not "it holds".
  # Withdrawn 2026-09-14, never raised. Both were registered speculatively, which
  # ADR 0118 D7 warns against, and a self-review found them with no raiser at all.
  #
  # W7001 was a mis-allocation as well as unused: the declarations say a reference
  # to a disabled record is an *error*, so a W-prefixed code was the wrong shape
  # for it. The rule is now E7025. I7001 would have emitted an informational line
  # per row reporting a version, which is noise rather than a diagnostic.
  #
  # Neither number is reused: governance rule 2 forbids reusing a retired code,
  # and a reader meeting W7001 in an old report deserves to find it here.

  # ---------------------------------------------------------------------------
  # Topology manifest governance contract, moved here 2026-09-11.
  #
  # governance_contract_validator emitted E7801..E7808, E7811, E7812 and
  # W7809/W7810/W7813 - eight of which docs/diagnostics-catalog.md assigns to
  # other owners: E7801..E7805 to L1 power source relations, E7808 to the
  # strict-only legacy paths contract, E7811..E7812 to framework/project
  # compatibility. All three of those owners implement their meaning, so the
  # manifest checks were the squatter. Two test suites asserted E7801 for two
  # unrelated things, which is what a code with two owners costs.
  #
  # E33xx was empty in source, catalog, ADR and documentation. Moving restores
  # single ownership to the eight rather than breaking immutability: each of them
  # keeps the meaning the registry already documented.
  # ---------------------------------------------------------------------------
  E3301:
    severity: error
    stage: validate
    title: Topology Version Invalid
    hint: topology version must be a non-empty string starting with '5.'.
  E3302:
    severity: error
    stage: validate
    title: Topology Model Invalid
    hint: topology model must be 'class-object-instance'.
  E3303:
    severity: error
    stage: validate
    title: Framework Section Invalid
    hint: framework must be an object whose declared paths are non-empty strings.
  E3304:
    severity: error
    stage: validate
    title: Project Section Invalid
    hint: project must be an object with non-empty active and projects_root.
  E3305:
    severity: error
    stage: validate
    title: Meta Instance Invalid
    hint: meta.instance must be a non-empty string.
  E3306:
    severity: error
    stage: validate
    title: Meta Instance Misaligned
    hint: meta.instance differs from project.active; aligned values keep resolution deterministic.
  E3307:
    severity: error
    stage: validate
    title: Meta Status Unknown
    hint: meta.status must be one of the declared lifecycle values.
  E3308:
    severity: error
    stage: validate
    title: Meta Metadata Dates Inconsistent
    hint: meta.metadata.last_updated must not be earlier than created.
  W3309:
    severity: warning
    stage: validate
    title: Meta Metadata Date Format
    hint: meta.metadata.created/last_updated should use YYYY-MM-DD.
  W3310:
    severity: warning
    stage: validate
    title: Changelog Missing Current Version
    hint: meta.metadata.changelog should contain an entry for the current version.
  E3311:
    severity: error
    stage: validate
    title: Default Security Policy Ref Unresolved
    hint: meta.defaults.refs.security_policy_ref must reference a known instance.
  E3312:
    severity: error
    stage: validate
    title: Default Network Manager Ref Invalid
    hint: meta.defaults.refs.network_manager_device_ref must reference a known L1 network-class device.
  W3313:
    severity: warning
    stage: validate
    title: Topology Version Unset
    hint: topology version is not set; an explicit 5.x version is required.

  # Framework module layout, moved here 2026-09-11 for the same reason as the
  # governance block above: foundation_layout_validator emitted E7811..E7813 for
  # framework *paths* while framework_lock.py emits them for framework *version
  # and schema compatibility*, which is what the registry documents them as.
  E3320:
    severity: error
    stage: validate
    title: Framework Paths Section Invalid
    hint: framework must be an object whose module-root paths are non-empty strings.
  E3321:
    severity: error
    stage: validate
    title: Framework Path Missing
    hint: A declared framework module root does not exist or is not a directory.
  E3322:
    severity: error
    stage: validate
    title: Framework Path Has No Modules
    hint: A declared framework module root contains no YAML module files.
  E3323:
    severity: error
    stage: validate
    title: Framework Roots Have No Plugin Manifests
    hint: Framework module roots contain no plugins.yaml manifests.
