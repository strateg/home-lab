schema_version: 1
metadata:
  targets:
    class_modules:
      root: topology/class-modules
      filename_prefix: class.
      required_keys:
        - "@title"
        - "@layer"
      min_coverage:
        "@title": 0.80
        "@layer": 0.80
    object_modules:
      root: topology/object-modules
      filename_prefix: obj.
      required_keys:
        - "@title"
      min_coverage:
        "@title": 0.80
warning_governance:
  allowlist:
    - W3201
    - W6814
    - W7816
    - W7844
    - W7864
    - W7892
    - W7941
    - W7942
  max_counts:
    # W3201: derived capabilities missing in capability catalog (new modules)
    W3201: 10
    # W6814: optional @on:host.network.bridge_ref? absent on docker-only host
    # srv-orangepi5 (no bridge by design).
    W6814: 8
    # W7016 was allowlisted here from 2026-10-09 to 2026-10-11 while rtr-slate
    # resolved as a network enforcer with no adapter able to render it. Removed
    # together with the cap.os.openwrt -> cap.firewall.security_matrix.openwrt
    # mapping that now exists in effective_model_compiler.py, because the
    # OpenWrt generator behind it exists. The warning no longer fires, so an
    # entry for it would be stale rather than protective.
    W7816: 5
    # W7844: svc-postgresql-germany attaches vpn_germany via WireGuard tunnel
    # routing, not direct VLAN (documented in instance).
    W7844: 1
    # W7864: docker-nginx uses RouterOS container bridge (inst.bridge.containers,
    # 172.18.0.0/24) - no VLAN to migrate to (ADR 0111).
    W7864: 1
    W7892: 50
    W7941: 5
    W7942: 10
legacy_boundary:
  scan_root: projects
  active_instances_root: projects/home-lab/topology/instances
  exclude_globs:
    - projects/*/_legacy/**
  key_patterns:
    class_ref: "^[\\s]*class_ref[\\s]*:"
    object_ref: "^[\\s]*object_ref[\\s]*:"
    group: "^group[\\s]*:"
