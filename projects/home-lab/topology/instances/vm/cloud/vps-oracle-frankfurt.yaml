@instance: vps-oracle-frankfurt
@extends: obj.oracle.cloud_vm
@group: vm
@version: 1.0.0
source_id: vps-oracle-frankfurt
status: active
notes: |
  OCI Always Free tier VM in Frankfurt.
  Dual WireGuard gateway architecture (ADR-0112):
    - wg0 (:51820): Admin tunnel for home LAN access
    - wg1 (:51821): Exit tunnel for internet traffic (isolated)

firmware_ref: inst.firmware.uefi.generic.x86_64
os_refs:
- inst.os.ubuntu.2404.x86_64.oci

# OCI Instance Details (from OCI API 2026-06-08)
oci:
  instance_id: ocid1.instance.oc1.eu-frankfurt-1.antheljtktcemiacour3ugube5pczalr6qmrumzhp43n47bkgsix3ahtr7da
  display_name: instance-20260608-1006
  vnic_name: Main VNIC
  region: eu-frankfurt-1
  availability_domain: EU-FRANKFURT-1-AD-1
  shape: VM.Standard.E2.1.Micro
  ocpus: 1
  vcpus: 2
  memory_gb: 1
  public_ip: true
  image_id: ocid1.image.oc1.eu-frankfurt-1.aaaaaaaaola3pvhd5tx7nnyt3ohx3ef62thau2nuxmbd7geg2u7jxvsruqmq

# Hardware specs (virtual)
hardware_specs:
  cpu:
    architecture: x86_64
    cores: 1
    threads: 2
    vendor: amd
    model: AMD EPYC 7551
  memory:
    size_mb: 1024
    type: ddr4

# Network configuration - dual tunnel
networking:
  primary_interface: ens3
  public_ip_ref: secrets.vps.oracle_frankfurt.public_ip
  tunnel_interfaces:
    # wg0: Admin tunnel - for home LAN access
    - name: wg0
      tunnel_ref: inst.tunnel.wg-home-to-oci
      tunnel_ip: 10.100.0.2/24
      listen_port: 51820
      role: server
      purpose: admin
    # wg1: Exit tunnel - for internet exit (isolated)
    - name: wg1
      tunnel_ref: inst.tunnel.wg-exit
      tunnel_ip: 10.100.1.2/24
      listen_port: 51821
      role: server
      purpose: exit

# WireGuard gateway configuration
wireguard_gateway:
  enabled: true
  ip_forwarding: true
  iptables_rules:
    forward:
      # wg0: Admin tunnel - hairpin only (peer-to-peer)
      - "-I FORWARD 1 -i wg0 -o wg0 -j ACCEPT"
      # wg1: Exit tunnel to internet (Germany exit)
      - "-I FORWARD 2 -i wg1 -o ens3 -j ACCEPT"
      - "-I FORWARD 3 -i ens3 -o wg1 -m state --state RELATED,ESTABLISHED -j ACCEPT"
      # wg1: Estonia chain - forward to MikroTik
      - "-I FORWARD 4 -i wg1 -o wg1 -j ACCEPT"
    nat:
      # wg1: Exit tunnel masquerade (Germany exit)
      - "-t nat -A POSTROUTING -s 10.100.1.0/24 -o ens3 -j MASQUERADE"
    # No NAT for wg0 - admin tunnel only

# VPN exit profiles (on wg1 only)
vpn_exit_profiles:
  # Germany Exit: direct masquerade to internet via ens3
  germany_exit:
    description: Full exit via German IP (OCI Frankfurt)
    tunnel_interface: wg1
    mode: direct
    clients:
      - 10.100.1.3/32  # Jolla vpn-germany
      - 10.100.1.4/32  # rtr-slate vpn-germany
      - 10.100.1.5/32  # ws-nixos vpn-germany
    exit_interface: ens3
    nat: masquerade

  # Estonia Chain: policy route through Chateau peer via wg1
  estonia_chain:
    description: Chained exit via Estonian IP (Chateau -> ISP)
    tunnel_interface: wg1
    mode: policy_route
    clients:
      - 10.100.1.6/32  # Jolla vpn-estonia
    next_hop: 10.100.1.1  # Chateau wg1 tunnel IP
    routing_table: estonia_chain
    ip_rules:
      - "ip rule add from 10.100.1.6 lookup estonia_chain priority 100"
    ip_routes:
      - "ip route add default via 10.100.1.1 dev wg1 table estonia_chain"

# Capabilities from cloud provider
enabled_capabilities:
- cap.compute.runtime.container_host
- cap.compute.workload.linux_base
- cap.network.vpn_gateway
