@instance: vps-oracle-frankfurt
@extends: obj.oracle.cloud_vm
@group: vm
@version: 1.2.0
source_id: vps-oracle-frankfurt
status: active
notes: OCI Always Free tier VM in Frankfurt; WireGuard gateway for VPN-Germany VLAN geo-bypass

firmware_ref: inst.firmware.uefi.generic.x86_64
os_refs:
- inst.os.ubuntu.2404.x86_64.oci

# OCI Instance Details (from OCI API 2026-06-08)
oci:
  instance_id: ocid1.instance.oc1.eu-frankfurt-1.antheljtktcemiacour3ugube5pczalr6qmrumzhp43n47bkgsix3ahtr7da
  display_name: instance-20260608-1006
  vnic_name: Main VNIC
  region: eu-frankfurt-1
  availability_domain: EU-FRANKFURT-1-AD-1
  shape: VM.Standard.E2.1.Micro
  ocpus: 1
  vcpus: 2
  memory_gb: 1
  public_ip: true
  image_id: ocid1.image.oc1.eu-frankfurt-1.aaaaaaaaola3pvhd5tx7nnyt3ohx3ef62thau2nuxmbd7geg2u7jxvsruqmq

# Hardware specs (virtual)
hardware_specs:
  cpu:
    architecture: x86_64
    cores: 1
    threads: 2
    vendor: amd
    model: AMD EPYC 7551
  memory:
    size_mb: 1024
    type: ddr4

# Network configuration
networking:
  primary_interface: ens3
  public_ip_ref: secrets.vps.oracle_frankfurt.public_ip
  tunnel_interfaces:
    - name: wg0
      tunnel_ref: inst.tunnel.wg-home-to-oci
      tunnel_ip: 10.100.0.2/24
      listen_port: 51820
      role: server

# WireGuard gateway configuration
wireguard_gateway:
  enabled: true
  tunnel_ref: inst.tunnel.wg-home-to-oci
  routed_networks:
    - network: 192.168.55.0/24
      vlan_ref: inst.vlan.vpn_germany
      nat: masquerade
  ip_forwarding: true
  iptables_rules:
    forward:
      - "-I FORWARD 1 -i wg0 -o ens3 -j ACCEPT"
      - "-I FORWARD 2 -i ens3 -o wg0 -m state --state RELATED,ESTABLISHED -j ACCEPT"
      # Hairpin for wg0->wg0 (peer-to-peer and Estonia chain)
      - "-I FORWARD 3 -i wg0 -o wg0 -j ACCEPT"
    nat:
      - "-t nat -A POSTROUTING -s 192.168.55.0/24 -o ens3 -j MASQUERADE"
      # Road warrior exit via German IP (Jolla, ws-nixos when using full exit)
      - "-t nat -A POSTROUTING -s 10.100.0.0/24 -o ens3 -j MASQUERADE"

# VPN exit profiles for road warriors
vpn_exit_profiles:
  # Germany Exit: direct masquerade to internet via ens3
  germany_exit:
    description: Full exit via German IP (OCI Frankfurt)
    mode: direct
    clients:
      - 10.100.0.3/32  # Jolla
      - 10.100.0.5/32  # ws-nixos (optional)
    exit_interface: ens3
    nat: masquerade

  # Estonia Chain: policy route through Chateau peer
  estonia_chain:
    description: Chained exit via Estonian IP (Chateau -> ISP)
    mode: policy_route
    clients:
      - 10.100.0.3/32  # Jolla (when using Estonia profile)
    next_hop: 10.100.0.1  # Chateau tunnel IP
    routing_table: estonia_chain
    # iproute2 configuration
    ip_rules:
      # Mark-based routing (fwmark set by iptables mangle)
      - "ip rule add fwmark 0x45 lookup estonia_chain priority 100"
    ip_routes:
      - "ip route add default via 10.100.0.1 dev wg0 table estonia_chain"
    iptables_mangle:
      # Mark Estonia-bound traffic (when Jolla uses Estonia profile DNS 192.168.88.1)
      # Profile selection is implicit: Germany uses 1.1.1.1 DNS, Estonia uses 192.168.88.1
      # For explicit control, use connection tracking or DSCP marking from client
      - "-t mangle -A PREROUTING -i wg0 -s 10.100.0.3 -m mark --mark 0x45 -j MARK --set-mark 0x45"

# Capabilities from cloud provider
enabled_capabilities:
- cap.compute.runtime.container_host
- cap.compute.workload.linux_base
- cap.network.vpn_gateway
