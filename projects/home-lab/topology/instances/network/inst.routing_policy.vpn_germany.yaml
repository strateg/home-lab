@instance: inst.routing_policy.vpn_germany
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.1.0
source_id: policy-vpn-germany
status: active
notes: |
  Routes all traffic from VLAN 55 (VPN Germany) through WireGuard tunnel wg1.
  Exit point: VPS in Frankfurt, Germany (130.61.160.221).

  Architecture (ADR-0112):
    - wg0: Admin tunnel for LAN access (inst.tunnel.wg-home-to-oci)
    - wg1: Exit tunnel for internet traffic (inst.tunnel.wg-exit)

  v1.1.0: Use vlan_ref instead of hardcoded CIDRs (ADR-0111 extension)

# Policy identification
policy_name: vpn-germany-routing
policy_description: Route VLAN 55 traffic through WireGuard to Frankfurt VPS

# Source: VLAN 55 subnet (CIDR resolved from vlan_ref)
source_match:
  type: subnet
  vlan_ref: inst.vlan.vpn_germany

# Target: WireGuard tunnel (wg1 for exit traffic per ADR-0112)
target_gateway:
  type: tunnel
  value: wg1
  tunnel_ref: inst.tunnel.wg-exit
  next_hop: 10.100.1.2

# Routing mark
routing_mark: "0x32"
priority: 100
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from VLAN 55.
  #    dst_address is negated so traffic to the local VLAN (incl. gateway)
  #    is never pushed into the tunnel. Negation requires literal address.
  mangle_rules:
    - chain: prerouting
      src_vlan_ref: inst.vlan.vpn_germany
      dst_address: "!192.168.55.0/24"  # negation - local traffic excluded
      action: mark-connection
      new_connection_mark: vpn-germany
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-germany
      # src_address restricts mark-routing to the ORIGINATING direction only.
      src_vlan_ref: inst.vlan.vpn_germany
      action: mark-routing
      new_routing_mark: vpn-tunnel
      passthrough: false

  # 2. Routing table for VPN traffic
  routing_table:
    name: vpn-tunnel
    fib: true

  # 3. Route in VPN routing table
  routes:
    - dst_address: 0.0.0.0/0
      gateway: wg1
      routing_table: vpn-tunnel

  # 4. NAT for VLAN 55 traffic through wg1
  nat_rules:
    - chain: srcnat
      src_vlan_ref: inst.vlan.vpn_germany
      out_interface: wg1
      action: masquerade
      comment: "NAT for VPN-Germany via wg1"

  # 5. Fasttrack for established VPN connections (performance optimization)
  fasttrack:
    enabled: true
    connection_mark: vpn-germany
    comment: "VPN-Germany fasttrack"

  # 6. Notrack for WireGuard UDP (bypass conntrack for better performance)
  #    IMPORTANT: in_interface=ether1 restricts to WAN-originated packets only.
  #    Without this, transit traffic from LAN to VPS:51821 would be notracked,
  #    breaking NAT/masquerade (conntrack required for NAT).
  notrack:
    - chain: prerouting
      protocol: udp
      dst_port: 51821
      in_interface: ether1
      comment: "WireGuard wg1 notrack inbound from WAN"
    - chain: output
      protocol: udp
      src_port: 51821
      comment: "WireGuard wg1 notrack outbound"

  # 7. Isolation firewall rules (ADR-0110)
  #    VPN VLAN must not access internal networks. Uses vlan_refs for DRY.
  firewall_rules:
    # Block access to LAN (legacy user network)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.lan
      comment: "VPN-Germany: block access to LAN"
    # Block access to User VLAN
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.user
      comment: "VPN-Germany: block access to User VLAN"
    # Block access to Management
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.management
      comment: "VPN-Germany: block access to Management"
    # Block access to Servers
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.servers
      comment: "VPN-Germany: block access to Servers"
    # Block cross-VPN access (Russia VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.vpn_amnezia
      comment: "VPN-Germany: block access to VPN-Russia"
    # Block cross-VPN access (Sweden VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      dst_vlan_ref: inst.vlan.vpn_sweden
      comment: "VPN-Germany: block access to VPN-Sweden"
    # Kill-switch: block direct WAN egress (must go through wg1)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_germany
      out_interface: ether1
      comment: "VPN-Germany kill-switch: block direct WAN"

# Managed by
managed_by_ref: rtr-mikrotik-chateau
