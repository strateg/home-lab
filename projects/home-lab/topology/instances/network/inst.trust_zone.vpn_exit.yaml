@instance: inst.trust_zone.vpn_exit
@extends: obj.network.trust_zone.vpn_tunnel
@group: network
@version: 1.0.0
source_id: zone-vpn-exit
status: active
notes: |
  ISOLATED trust zone for VPN exit traffic.
  Devices in this zone can ONLY reach the internet via WireGuard exit tunnel (wg1).
  NO access to any internal VLANs (management, servers, user, LAN, etc.)

  Used by road-warrior clients using vpn-germany/vpn-estonia profiles.
  This zone has the LOWEST trust level (0) for maximum isolation.

zone_name: vpn-exit

# Trust level 0 - lowest, isolated from all internal networks
trust_level: 0
isolated: true

# Additional networks for this zone
additional_networks:
  - cidr: 10.100.1.0/24
    comment: "WireGuard exit tunnel (wg1) road-warrior network"

# Firewall policy: internet-only via multiple exit paths
firewall_policy:
  # Allow outbound to internet via different exit tunnels
  outbound:
    # vpn-estonia: exit via MikroTik WAN (through wg1 back to VPS not needed here)
    - action: accept
      destination: untrusted
      out_interface_list: WAN
      comment: "Allow internet via MikroTik WAN (vpn-estonia)"
    # vpn-russia: exit via AWG Russia tunnel
    - action: accept
      destination: untrusted
      via_interface: wg-awg-russia
      comment: "Allow internet via AWG Russia tunnel (vpn-russia)"
    # vpn-sweden: exit via AWG Sweden tunnel
    - action: accept
      destination: untrusted
      via_interface: wg-awg-sweden
      comment: "Allow internet via AWG Sweden tunnel (vpn-sweden)"

  # Allow established/related return traffic
  inbound:
    - action: accept
      state: [established, related]
      comment: "Allow return traffic"

  # BLOCK ALL internal zones - explicit deny for security
  blocked_zone_refs:
    - inst.trust_zone.user
    - inst.trust_zone.guest
    - inst.trust_zone.iot
    - inst.trust_zone.servers
    - inst.trust_zone.management
    - inst.trust_zone.vpn_tunnel

  # No tunnel network access (only exit traffic allowed)
  allow_tunnel_networks: false
