@instance: inst.routing_policy.vpn_sweden
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.1.0
source_id: policy-vpn-sweden
status: active
notes: |
  Routes all traffic from VLAN 58 (VPN Sweden) through AmneziaWG container.
  Container runs on veth interface and tunnels traffic via AWG protocol.

  Traffic flow:
    Client (192.168.58.x) -> vlan58 -> mangle mark ->
    routing table awg-sweden -> veth-awg-se (172.18.21.2) ->
    AmneziaWG container -> AWG tunnel -> VPN server Sweden -> Internet

  v1.1.0: Use vlan_ref instead of hardcoded CIDRs (ADR-0111 extension)

# Policy identification
policy_name: vpn-sweden-routing
policy_description: Route VLAN 58 traffic through AmneziaWG Sweden container

# Source: VLAN 58 subnet (CIDR resolved from vlan_ref)
source_match:
  type: subnet
  vlan_ref: inst.vlan.vpn_sweden

# Target: AmneziaWG Sweden container via veth
target_gateway:
  type: container_veth
  value: veth-awg-se
  container_ref: docker-amneziawg-sweden
  next_hop: 172.18.21.2

# Routing mark (unique for AWG Sweden)
routing_mark: "0x3A"
priority: 100
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from VLAN 58.
  #    dst_address is negated so traffic to local VLAN is not tunneled.
  mangle_rules:
    - chain: prerouting
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_address: "!192.168.58.0/24"  # negation - local traffic excluded
      action: mark-connection
      new_connection_mark: vpn-sweden
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-sweden
      src_vlan_ref: inst.vlan.vpn_sweden
      action: mark-routing
      new_routing_mark: awg-sweden
      passthrough: false

  # 2. Routing table for AWG Sweden traffic
  routing_table:
    name: awg-sweden
    fib: true

  # 3. Route in AWG routing table -> container veth
  routes:
    - dst_address: 0.0.0.0/0
      gateway: 172.18.21.2
      routing_table: awg-sweden

  # 4. Static route for VPN endpoint via WAN (prevent routing loop)
  #    Container must reach VPN server directly, not through AWG tunnel.
  endpoint_routes:
    - dst_address: 146.70.206.133/32
      gateway: ether1
      distance: 1
      comment: "AmneziaWG VPN endpoint Sweden - bypass tunnel"

  # 5. MSS clamping for tunnel MTU issues
  mss_clamp:
    chain: forward
    out_interface: veth-awg-se
    new_mss: 1340

  # 6. Firewall rules for container traffic and isolation
  firewall_rules:
    # Container must reach VPN endpoint via WAN
    - chain: forward
      action: accept
      in_interface: veth-awg-se
      out_interface: ether1
      comment: "AWG Sweden container WAN egress - allow VPN tunnel establishment"
      priority: high
    # Isolation rules (ADR-0110) - VPN VLAN must not access internal networks
    # Block access to LAN (legacy user network)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.lan
      comment: "VPN-Sweden: block access to LAN"
    # Block access to User VLAN
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.user
      comment: "VPN-Sweden: block access to User VLAN"
    # Block access to Management
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.management
      comment: "VPN-Sweden: block access to Management"
    # Block access to Servers
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.servers
      comment: "VPN-Sweden: block access to Servers"
    # Block cross-VPN access (Russia VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.vpn_amnezia
      comment: "VPN-Sweden: block access to VPN-Russia"
    # Block cross-VPN access (Germany VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      dst_vlan_ref: inst.vlan.vpn_germany
      comment: "VPN-Sweden: block access to VPN-Germany"
    # Kill-switch: block direct WAN egress (must go through container)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_sweden
      out_interface: ether1
      comment: "VPN-Sweden kill-switch: block direct WAN"

  # 7. NAT rule for container traffic to WAN
  #    Masquerade container traffic going to ether1
  nat_rules:
    - chain: srcnat
      action: masquerade
      src_address: 172.18.21.0/30
      out_interface: ether1
      comment: "NAT for AWG Sweden container WAN egress"

# Managed by
managed_by_ref: rtr-mikrotik-chateau
