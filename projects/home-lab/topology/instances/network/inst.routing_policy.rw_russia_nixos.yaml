@instance: inst.routing_policy.rw_russia_nixos
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.0.0
source_id: policy-rw-russia-nixos
status: active
notes: |
  Routes ws-nixos' Russian-exit profile (wg1, 10.100.1.9) through the AWG
  Russia tunnel. Sibling of inst.routing_policy.rw_russia, which does the
  same for 10.100.1.7; one policy per road-warrior address, because the
  source address is what the mangle rules match on.

  Architecture:
    - ws-nixos picks its vpn-russia profile and connects to VPS wg1 as
      10.100.1.9 (inst.tunnel.wg-exit, road_warrior_peers, exit_mode:
      chained, mikrotik_routing_table: awg-russia)
    - VPS forwards to MikroTik wg1
    - MikroTik marks the connection and routes it to wg-awg-russia
    - the awg-proxy container adds AWG obfuscation
    - traffic exits via the VPN Russia server

  WHY THIS INSTANCE EXISTS (2026-10-21)

  The Chateau half of this path was configured by hand on the router and was
  never modelled, so it was never rendered and never owned by Terraform. The
  hand-made rules were found in this state:

    mangle  *34 / *35   out-of-band, 0 packets - the right shape
    filter  *185 / *186 out-of-band, 0 packets, INVALID (they name interface
                        *36, the v1 AWG Russia container removed 2026-10-01)
                        and placed AFTER the zone firewall's final drop-all,
                        so unreachable even had the interface existed

  Both wg1 and wg-awg-russia are in the VPN_EXIT interface list and the only
  reachable VPN_EXIT rule is VPN_EXIT -> WAN, so nothing permitted
  wg1 -> wg-awg-russia for this address: the profile could not have worked.
  The generator renders every rule here with `place_before` the final
  drop-all, which is exactly the mistake the hand-made rules made.

  inst.tunnel.wg-exit.yaml's `chateau_routing` block already described these
  mangle and firewall rules. No generator reads that block - it reaches the
  effective-topology dump and nothing else - so it documented the intent
  without enforcing it. This instance is the enforceable form; see the note
  there.

  BEFORE THE NEXT APPLY, read docs/reports/2026-10-21-chateau-dead-rules.md:
  the four out-of-band rules above must be imported or deleted first, or
  RouterOS will happily hold a second copy of each.

# Policy identification
policy_name: rw-nixos-russia-routing
policy_description: Route ws-nixos road-warrior 10.100.1.9 through AWG Russia

# Source: specific IP address (not VLAN)
source_match:
  type: ip_address
  value: "10.100.1.9"

# Target: WireGuard interface (reuse existing AWG Russia tunnel)
target_gateway:
  type: wireguard_interface
  value: wg-awg-russia
  container_ref: docker-amneziawg-russia

# Reuse the existing awg-russia routing table
routing_mark: "0x3B"
priority: 110
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from 10.100.1.9.
  #    Shape and mark names match the rules already on the router (*34/*35),
  #    so importing them produces a comment diff and nothing else.
  mangle_rules:
    - chain: prerouting
      src_address: "10.100.1.9"
      dst_address: "!10.100.1.0/24"
      action: mark-connection
      new_connection_mark: vpn-rw-russia-nixos
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-rw-russia-nixos
      src_address: "10.100.1.9"
      action: mark-routing
      new_routing_mark: awg-russia
      passthrough: false

  # 2. The awg-russia routing table and its default route already exist,
  #    created by inst.routing_policy.vpn_amnezia. Nothing to add.

  # 3. Firewall rules for wg1 <-> wg-awg-russia traffic
  firewall_rules:
    - chain: forward
      action: accept
      in_interface: wg1
      out_interface: wg-awg-russia
      src_address: "10.100.1.9"
      comment: "RW-nixos-Russia: forward egress"
      priority: high
    - chain: forward
      action: accept
      in_interface: wg-awg-russia
      out_interface: wg1
      dst_address: "10.100.1.9"
      comment: "RW-nixos-Russia: forward ingress"
      priority: high

  # NAT is handled by the existing vpn_amnezia policy (masquerade on
  # wg-awg-russia).

# Managed by
managed_by_ref: rtr-mikrotik-chateau
