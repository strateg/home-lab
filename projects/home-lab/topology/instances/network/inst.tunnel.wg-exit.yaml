@instance: inst.tunnel.wg-exit
@extends: obj.network.wireguard_tunnel
@group: network
@version: 1.0.0
source_id: inst.tunnel.wg-exit
status: active
notes: |
  WireGuard EXIT tunnel (wg1) for ESTONIA exit traffic ONLY.
  PURPOSE: Estonian IP exit. ISOLATED from LAN - no local access.

  Architecture (ADR-0112):
    - wg0: Admin tunnel + Germany exit (inst.tunnel.wg-home-to-oci)
    - wg1: Estonia exit ONLY (this file)

  Traffic flow:
    vpn-estonia: Client (10.100.1.x) -> VPS wg1 -> MikroTik wg1 -> WAN -> Estonian IP

  ISOLATION: wg1 interface on MikroTik is in VPN_EXIT interface list,
  which has firewall rules blocking ALL access to LAN VLANs.

# Tunnel interface name
tunnel_name: wg1

# Tunnel network (separate from wg0)
tunnel_network: 10.100.1.0/24

# Endpoint A: MikroTik Chateau (for Estonia exit)
endpoint_a:
  device_ref: rtr-mikrotik-chateau
  role: client
  tunnel_ip: 10.100.1.1/24
  persistent_keepalive: 25
  # MikroTik tunnel endpoint - only its own IP
  # Estonia chain routing is handled by policy routing on VPS (ip rule),
  # NOT by WireGuard AllowedIPs. Using 0.0.0.0/0 here would route ALL
  # traffic to MikroTik, breaking vpn-germany direct exit.
  allowed_ips:
    - 10.100.1.1/32
  # CRITICAL: Interface list is VPN_EXIT (isolated from LAN)
  mikrotik_interface_list: VPN_EXIT

# Endpoint B: Oracle Cloud VPS (server)
endpoint_b:
  device_ref: vps-oracle-frankfurt
  role: server
  tunnel_ip: 10.100.1.2/24
  listen_port: 51821
  # public_endpoint loaded from secrets
  allowed_ips:
    - 10.100.1.2/32

# Road-warrior peers for EXIT profiles (vpn-germany, vpn-estonia)
road_warrior_peers:
  - device_ref: inst.device.jolla-phone-2026
    persistent_keepalive: 25
    vpn_profiles:
      - name: vpn-germany
        description: "Full exit via German IP (OCI Frankfurt)"
        tunnel_ip: 10.100.1.3/32
        routes:
          - 0.0.0.0/0
          - "::/0"
        dns: "1.1.1.1, 1.0.0.1"
        exit_mode: direct
        exit_country: DE
        # NOTE: block_dns_leaks disabled - Sailfish OS doesn't run PostDown
        # scripts, leaving iptables kill switch active after disconnect

      - name: vpn-estonia
        description: "Exit via Estonian IP (MikroTik WAN)"
        tunnel_ip: 10.100.1.6/32
        routes:
          - 0.0.0.0/0
          - "::/0"
        dns: "1.1.1.1, 1.0.0.1"
        exit_mode: chained
        exit_country: EE
        next_hop: 10.100.1.1
        # Fix routing loop when client is on same network as exit node
        preserve_endpoint_route: true
        # NOTE: block_dns_leaks disabled - Sailfish OS doesn't run PostDown
        # scripts, leaving iptables kill switch active after disconnect

  - device_ref: ws-nixos
    persistent_keepalive: 25
    vpn_profiles:
      - name: vpn-germany
        description: "Full exit via German IP"
        tunnel_ip: 10.100.1.5/32
        routes:
          - 0.0.0.0/0
          - "::/0"
        dns: "1.1.1.1, 1.0.0.1"
        exit_mode: direct
        exit_country: DE

  - device_ref: rtr-slate
    persistent_keepalive: 25
    vpn_profiles:
      - name: vpn-germany
        description: "Full exit via German IP"
        tunnel_ip: 10.100.1.4/32
        routes:
          - 0.0.0.0/0
          - "::/0"
        dns: "1.1.1.1, 1.0.0.1"
        exit_mode: direct
        exit_country: DE

# Routing configuration - exit traffic only
routing:
  propagate_routes: false
  route_all_traffic: true

# WireGuard keys stored in secrets
secrets_ref: secrets.tunnels.wg-exit

# Firewall integration
firewall:
  vps_allow_inbound:
    protocol: udp
    port: 51821
    source: any
  # wg1 on MikroTik is ISOLATED (VPN_EXIT interface list)
  mikrotik_interface_list: VPN_EXIT

# NAT configuration on VPS
vps_nat:
  enabled: true
  masquerade:
    # All wg1 road-warriors masquerade to VPS public IP for Germany exit
    source_networks:
      - 10.100.1.0/24
    out_interface: ens3
  # Policy routing for Estonia exit
  policy_routes:
    - name: estonia_chain
      description: "Route Estonia profile to MikroTik for exit"
      source_ip: 10.100.1.6/32
      table_id: 100
      next_hop: 10.100.1.1
      via_interface: wg1
  ip_forward: true

# NAT configuration on MikroTik (for Estonia exit)
chateau_nat:
  enabled: true
  masquerade:
    source_networks:
      - 10.100.1.0/24
    out_interface_list: WAN
    comment: "VPN exit tunnel masquerade to Estonian IP"

# Use cases for this tunnel
use_cases:
  - Road-warrior internet exit via German IP (vpn-germany profile)
  - Road-warrior internet exit via Estonian IP (vpn-estonia profile)
  - Geo-bypass for streaming services
  - Privacy exit nodes with country selection
