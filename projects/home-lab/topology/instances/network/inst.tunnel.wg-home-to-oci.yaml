@instance: inst.tunnel.wg-home-to-oci
@extends: obj.network.wireguard_tunnel
@group: network
@version: 1.0.0
source_id: inst.tunnel.wg-home-to-oci
status: active
notes: |
  WireGuard ADMIN tunnel (wg0) for home network access.
  PURPOSE: Management and LAN access ONLY. NOT for internet exit.

  Architecture (ADR-0112):
    - wg0: Admin tunnel for LAN/management access (this file)
    - wg1: Exit tunnel for internet traffic (inst.tunnel.wg-exit)

  Traffic type: Split tunnel to home VLANs only
  Exit traffic: NONE (use wg1 for vpn-germany/vpn-estonia profiles)

# Tunnel interface name
tunnel_name: wg0

# Tunnel network
tunnel_network: 10.100.0.0/24

# MTU 1420 is standard for WireGuard
mtu: 1420

# Endpoint A: MikroTik Chateau (client/initiator)
# Behind LTE/NAT, initiates connection to VPS
# Note: listen_port preserved for legacy "back-to-home-vpn" peer
endpoint_a:
  device_ref: rtr-mikrotik-chateau
  role: client
  listen_port: 51820  # Preserved for legacy peers
  tunnel_ip: 10.100.0.1/24
  persistent_keepalive: 25
  # Networks that MikroTik will advertise through tunnel
  allowed_ips:
    - 10.100.0.1/32
  allowed_vlan_refs:
    - inst.vlan.lan        # 192.168.88.0/24 - Default LAN
    - inst.vlan.servers    # 10.0.100.0/24 - Servers
    - inst.vlan.management # 10.0.99.0/24 - Management

# Endpoint B: Oracle Cloud VPS (server/responder)
endpoint_b:
  device_ref: vps-oracle-frankfurt
  role: server
  tunnel_ip: 10.100.0.2/24
  listen_port: 51820
  # public_endpoint loaded from secrets
  allowed_ips:
    - 10.100.0.2/32
    # NO 0.0.0.0/0 - this is NOT an exit tunnel

# Road-warrior peers for ADMIN ACCESS ONLY (vpn-home profile)
road_warrior_peers:
  - device_ref: inst.device.jolla-phone-2026
    tunnel_ip: 10.100.0.3/24
    persistent_keepalive: 25
    dns: 192.168.88.1
    routes:
      - 192.168.88.0/24
      - 10.100.0.0/24
      - 10.0.100.0/24
      - 10.0.99.0/24
    # Only vpn-home profile on wg0 - exit profiles moved to wg1
    vpn_profiles:
      - name: vpn-home
        description: "Access home network (split tunnel)"
        tunnel_ip: 10.100.0.3/32
        routes:
          - 192.168.88.0/24
          - 10.100.0.0/24
          - 10.0.100.0/24
          - 10.0.99.0/24
        dns: 192.168.88.1

  # Workstation: development machine with LAN/management access
  - device_ref: ws-nixos
    tunnel_ip: 10.100.0.5/24
    persistent_keepalive: 25
    dns: 192.168.88.1
    routes:
      - 192.168.88.0/24
      - 10.100.0.0/24
      - 10.0.99.0/24
    vpn_profiles:
      - name: vpn-home
        description: "Access home network (split tunnel)"
        tunnel_ip: 10.100.0.5/32
        routes:
          - 192.168.88.0/24
          - 10.100.0.0/24
          - 10.0.99.0/24
        dns: 192.168.88.1

  # Travel VPN gateway: carries its own client segments into the tunnel.
  #
  # `gateway_for` was removed here on 2026-10-11. It declared srv-orangepi5 as
  # reaching the tunnel through this peer, which is backwards - orangepi5 lives
  # on the home management VLAN and has no reason to route through a travel
  # router. More importantly the field's own contract is "only valid when the
  # peer masquerades its LAN into the tunnel, so the hub still sees a single
  # /32", and rtr-slate deliberately does the opposite: it routes its segments
  # without SNAT so the client source IP survives to the far end. The correct
  # expression of that is `advertises` plus matching AllowedIPs, below.
  - device_ref: rtr-slate
    tunnel_ip: 10.100.0.4/24
    persistent_keepalive: 25
    # Subnets this peer brings into the tunnel. The hub and the VPS must carry
    # them in AllowedIPs for return traffic to find its way back.
    #
    # `advertises` is read by zero lines of the runtime today: the generator
    # that would have rendered it is on the conserved rtr-slate Terraform
    # track, and the WireGuard templates here key on `routes` and `tunnel_ip`.
    # So generated/home-lab/wireguard/vps-wg0.conf still lists this peer as
    # AllowedIPs = 10.100.0.4/32 and the two subnets below have to be added to
    # the hub by hand - or the field taught to the wireguard generator - before
    # return traffic to a Slate client works. Declared here because it is the
    # correct expression of the design, and silence would be worse.
    advertises:
      - 10.77.1.0/24   # Slate-Home,  full tunnel
      - 10.77.2.0/24   # Slate-Split, home-bound traffic only
    routes:
      - 192.168.88.0/24   # home LAN
      - 10.100.0.0/24     # tunnel overlay
      - 10.0.100.0/24     # servers - permitted by the matrix (80/443, 5432, 6379)
      # 10.0.99.0/24 (management) is deliberately absent. inst.security_matrix
      # .rtr_slate leaves R4's uphill deny in place for user -> management, so a
      # route here would be config the firewall discards. The two files agree on
      # purpose; see that matrix's commented-out override to enable both at once.
    # `dns` is deliberately omitted: this peer runs dnsmasq for its own
    # segments, and the object's contract warns that pushing a resolver to a
    # gateway peer breaks every lookup on its LAN whenever the tunnel is down.

# Routing configuration - NO exit traffic
routing:
  propagate_routes: true
  route_all_traffic: false
  allowed_networks:
    - 10.100.0.0/24

# WireGuard keys stored in secrets
secrets_ref: secrets.tunnels.wg-home-to-oci

# Firewall integration
firewall:
  vps_allow_inbound:
    protocol: udp
    port: 51820
    source: any
  # wg0 on MikroTik is trusted (LAN interface list)
  mikrotik_interface_list: LAN

# NO NAT on admin tunnel - only split tunnel access
vps_nat:
  enabled: false

# Use cases for this tunnel
use_cases:
  - Access home network services from VPS
  - Road-warrior access to home LAN (vpn-home profile)
  - MikroTik management via tunnel
  - Access servers and services at home
