@instance: inst.vlan.vpn_amnezia
@extends: obj.network.vlan.vpn_tunnel
@group: network
@version: 1.0.0
source_id: net-vpn-amnezia
status: staged
notes: |
  VLAN for devices requiring Russian IP address via AmneziaWG.
  All traffic routed through AmneziaWG container to VPN server in Russia.
  Use cases: accessing Russian services (Yandex, VK, Russian streaming),
  bypassing geo-restrictions, DPI evasion via AWG obfuscation.

# VLAN configuration (VLAN 57 ∈ VPN block 50-59)
vlan_id: 57
cidr: 192.168.57.0/24
gateway: 192.168.57.1
dhcp_range: 192.168.57.100-192.168.57.200

# VPN routing specifics - uses container, not direct tunnel
vpn_routing:
  enabled: true
  # AmneziaWG runs as container, traffic routes through veth
  container_ref: docker-amneziawg-russia
  routing_mark: "0x39"
  exit_type: amneziawg
  exit_country: RU
  exit_location: Russia
  endpoint: 178.130.51.136:4714

# Trust zone - isolated from main LAN (shares zone with other VPN VLANs)
trust_zone_ref: inst.trust_zone.vpn_tunnel

# Managed by MikroTik Chateau
managed_by_ref: rtr-mikrotik-chateau

ip_allocations:
  - device_ref: rtr-mikrotik-chateau
    host: 1
    purpose: gateway, DNS, DHCP
