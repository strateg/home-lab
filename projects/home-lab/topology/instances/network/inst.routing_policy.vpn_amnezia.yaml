@instance: inst.routing_policy.vpn_amnezia
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.1.0
source_id: policy-vpn-russia
status: active
notes: |
  Routes all traffic from VLAN 57 (VPN Russia) through AmneziaWG container.
  Container runs on veth interface and tunnels traffic via AWG protocol.

  Traffic flow:
    Client (192.168.57.x) -> vlan57 -> mangle mark ->
    routing table awg-russia -> veth-awg-ru (172.18.20.2) ->
    AmneziaWG container -> AWG tunnel -> VPN server Russia -> Internet

  v1.1.0: Use vlan_ref instead of hardcoded CIDRs (ADR-0111 extension)

# Policy identification
policy_name: vpn-russia-routing
policy_description: Route VLAN 57 traffic through AmneziaWG Russia container

# Source: VLAN 57 subnet (CIDR resolved from vlan_ref)
source_match:
  type: subnet
  vlan_ref: inst.vlan.vpn_amnezia

# Target: AmneziaWG container via veth
target_gateway:
  type: container_veth
  value: veth-awg-ru
  container_ref: docker-amneziawg
  next_hop: 172.18.20.2

# Routing mark (unique for AWG Russia)
routing_mark: "0x39"
priority: 100
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from VLAN 57.
  #    dst_address is negated so traffic to local VLAN is not tunneled.
  mangle_rules:
    - chain: prerouting
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_address: "!192.168.57.0/24"  # negation - local traffic excluded
      action: mark-connection
      new_connection_mark: vpn-russia
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-russia
      src_vlan_ref: inst.vlan.vpn_amnezia
      action: mark-routing
      new_routing_mark: awg-russia
      passthrough: false

  # 2. Routing table for AWG Russia traffic
  routing_table:
    name: awg-russia
    fib: true

  # 3. Route in AWG routing table -> container veth
  routes:
    - dst_address: 0.0.0.0/0
      gateway: 172.18.20.2
      routing_table: awg-russia

  # 4. Static route for VPN endpoint via WAN (prevent routing loop)
  #    NOTE: Not needed for container-based AWG. Container handles this via
  #    PreUp script in awg0.conf: "ip route add <endpoint> via 172.18.20.1"
  #    MikroTik default route (from DHCP) handles the rest.
  #    Removed endpoint_routes - was using gateway=ether1 which doesn't work
  #    when MikroTik is behind NAT (WAN via DHCP from upstream router).

  # 5. MSS clamping for tunnel MTU issues
  mss_clamp:
    chain: forward
    out_interface: veth-awg-ru
    new_mss: 1340

  # 6. Firewall rules for container traffic and isolation
  firewall_rules:
    # Container must reach VPN endpoint via WAN
    - chain: forward
      action: accept
      in_interface: veth-awg-ru
      out_interface: ether1
      comment: "AWG Russia container WAN egress"
      priority: high
    # Isolation rules (ADR-0110) - VPN VLAN must not access internal networks
    # Block access to LAN (legacy user network)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.lan
      comment: "VPN-Russia: block access to LAN"
    # Block access to User VLAN
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.user
      comment: "VPN-Russia: block access to User VLAN"
    # Block access to Management
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.management
      comment: "VPN-Russia: block access to Management"
    # Block access to Servers
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.servers
      comment: "VPN-Russia: block access to Servers"
    # Block cross-VPN access (Sweden VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.vpn_sweden
      comment: "VPN-Russia: block access to VPN-Sweden"
    # Block cross-VPN access (Germany VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.vpn_germany
      comment: "VPN-Russia: block access to VPN-Germany"
    # Kill-switch: block direct WAN egress (must go through container)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      out_interface: ether1
      comment: "VPN-Russia kill-switch: block direct WAN"

  # 7. NAT rule for container traffic to WAN
  nat_rules:
    - chain: srcnat
      action: masquerade
      src_address: 172.18.20.0/30
      out_interface: ether1
      comment: "NAT for AWG Russia container WAN egress"

# Managed by
managed_by_ref: rtr-mikrotik-chateau
