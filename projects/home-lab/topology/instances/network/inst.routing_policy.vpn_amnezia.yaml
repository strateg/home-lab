@instance: inst.routing_policy.vpn_amnezia
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.0.0
source_id: policy-vpn-russia
status: active
notes: |
  Routes all traffic from VLAN 57 (VPN Russia) through AWG-Proxy architecture.

  Architecture (v2.0.0 - awg-proxy):
    - MikroTik native WireGuard handles encryption (wg-awg-russia)
    - awg-proxy container adds AWG 3.0 obfuscation
    - Traffic routes directly to WG interface (not veth)

  Traffic flow:
    Client (192.168.57.x) -> vlan57 -> mangle mark ->
    routing table awg-russia -> wg-awg-russia (WireGuard) ->
    awg-proxy container (172.18.22.2) -> AWG obfuscation ->
    VPN server Russia -> Internet

  v2.0.0: Migrated to awg-proxy with native WireGuard routing
  v1.1.0: Use vlan_ref instead of hardcoded CIDRs (ADR-0111 extension)

# Policy identification
policy_name: vpn-russia-routing
policy_description: Route VLAN 57 traffic through AWG-Proxy Russia

# Source: VLAN 57 subnet (CIDR resolved from vlan_ref)
source_match:
  type: subnet
  vlan_ref: inst.vlan.vpn_amnezia

# Target: WireGuard interface (native MikroTik WG, not container veth)
target_gateway:
  type: wireguard_interface
  value: wg-awg-russia
  container_ref: docker-amneziawg-russia

# Routing mark (unique for AWG Russia)
routing_mark: "0x39"
priority: 100
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from VLAN 57.
  #    dst_address is negated so traffic to local VLAN is not tunneled.
  mangle_rules:
    - chain: prerouting
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_address: "!192.168.57.0/24"  # negation - local traffic excluded
      action: mark-connection
      new_connection_mark: vpn-russia
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-russia
      src_vlan_ref: inst.vlan.vpn_amnezia
      action: mark-routing
      new_routing_mark: awg-russia
      passthrough: false

  # 2. Routing table for AWG Russia traffic
  routing_table:
    name: awg-russia
    fib: true

  # 3. Route in AWG routing table -> WireGuard interface
  routes:
    - dst_address: 0.0.0.0/0
      gateway: wg-awg-russia
      routing_table: awg-russia

  # 4. MSS clamping for tunnel MTU issues
  mss_clamp:
    chain: forward
    out_interface: wg-awg-russia
    new_mss: 1360

  # 5. Firewall rules for tunnel traffic and isolation
  firewall_rules:
    # Allow VPN VLAN to tunnel egress
    - chain: forward
      action: accept
      src_vlan_ref: inst.vlan.vpn_amnezia
      out_interface: wg-awg-russia
      comment: "VPN-Russia tunnel egress"
      priority: high
    # Allow tunnel ingress to VPN VLAN
    - chain: forward
      action: accept
      in_interface: wg-awg-russia
      dst_vlan_ref: inst.vlan.vpn_amnezia
      comment: "VPN-Russia tunnel ingress"
      priority: high
    # Container must reach VPN endpoint via WAN
    - chain: forward
      action: accept
      in_interface: veth-awg-ru
      out_interface: ether1
      comment: "AWG-Proxy Russia container WAN egress"
      priority: high
    # Isolation rules (ADR-0110) - VPN VLAN must not access internal networks
    # Block access to LAN (legacy user network)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.lan
      comment: "VPN-Russia: block access to LAN"
    # Block access to User VLAN
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.user
      comment: "VPN-Russia: block access to User VLAN"
    # Block access to Management
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.management
      comment: "VPN-Russia: block access to Management"
    # Block access to Servers
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.servers
      comment: "VPN-Russia: block access to Servers"
    # Block cross-VPN access (Sweden VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.vpn_sweden
      comment: "VPN-Russia: block access to VPN-Sweden"
    # Block cross-VPN access (Germany VLAN)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      dst_vlan_ref: inst.vlan.vpn_germany
      comment: "VPN-Russia: block access to VPN-Germany"
    # Kill-switch: block direct WAN egress (must go through tunnel)
    - chain: forward
      action: drop
      src_vlan_ref: inst.vlan.vpn_amnezia
      out_interface: ether1
      comment: "VPN-Russia kill-switch: block direct WAN"

  # 6. NAT rules
  nat_rules:
    # NAT for VPN tunnel (masquerade to tunnel IP)
    - chain: srcnat
      action: masquerade
      out_interface: wg-awg-russia
      comment: "NAT for VPN-Russia tunnel"
    # NAT for container traffic to WAN (for VPN endpoint connection)
    - chain: srcnat
      action: masquerade
      src_address: 172.18.22.0/30
      out_interface: ether1
      comment: "NAT for AWG-Proxy Russia container WAN egress"

# Managed by
managed_by_ref: rtr-mikrotik-chateau
