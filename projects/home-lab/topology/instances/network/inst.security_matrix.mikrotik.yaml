@instance: inst.security_matrix.mikrotik
@extends: obj.network.security_matrix.soho
@group: network
@version: 1.0.0
source_id: security-matrix-mikrotik
notes: |
  Perimeter enforcement matrix for rtr-mikrotik-chateau.
  Manages inter-VLAN routing, WAN access, and zone isolation policies.
  Generated output: generated/home-lab/terraform/mikrotik/firewall.tf

# ADR-0110 M1-B: one matrix = one enforcer
managed_by_ref: rtr-mikrotik-chateau

# Project-specific zone instances (override object-level refs)
zone_refs:
  - inst.trust_zone.untrusted
  - inst.trust_zone.guest
  - inst.trust_zone.iot
  - inst.trust_zone.vpn_tunnel
  - inst.trust_zone.vpn_exit  # Road-warrior VPN exit zone (10.100.1.0/24)
  - inst.trust_zone.user
  - inst.trust_zone.servers
  - inst.trust_zone.management

# Canonical address space for this enforcement plane.
# VLAN instance cidr is the single source of truth for all IP derivation.
address_space:
  vlan_refs:
    - inst.vlan.lan
    - inst.vlan.user
    - inst.vlan.guest
    - inst.vlan.iot
    - inst.vlan.vpn_germany
    - inst.vlan.vpn_amnezia
    - inst.vlan.vpn_sweden
    # Added 2026-10-11. This list was declarative only - nothing read it - so
    # its omission of vpn_exit cost nothing while zone -> VLAN resolution was
    # global. Once the compiler began resolving each scope inside its own
    # address space, the gap would have dropped 192.168.56.0/24 out of this
    # router's zone-vpn_exit address list, which is a live firewall change and
    # not the intent of scoping.
    - inst.vlan.vpn_exit
    - inst.vlan.management
    - inst.vlan.servers

defaults:
  dns_servers:
    - 192.168.88.1
  dhcp_lease_time: "30m"

# This enforcement scope has not yet had its availability objectives attested.
# Explicitly record the current absence rather than treating it as implicitly safe.
availability_requirements: []
availability_waiver:
  owner: home-lab platform owner
  rationale: >-
    Availability objectives for this perimeter matrix have not yet been formally
    attested; this waiver records that status and does not assert service health.

# Extends policy_overrides from obj.network.security_matrix.soho
policy_overrides:
  # Inherited from object:
  # - user-to-servers-http (tcp 80, 443)

  # Project-specific additions:
  - name: user-to-servers-db
    from_zone_ref: inst.trust_zone.user
    to_zone_ref: inst.trust_zone.servers
    action: accept
    ports:
      tcp: [5432, 6379]
    log: false
    comment: PostgreSQL and Redis access from user zone

  - name: management-to-servers-full
    from_zone_ref: inst.trust_zone.management
    to_zone_ref: inst.trust_zone.servers
    action: accept
    log: false
    comment: Management plane has full access to servers zone

  - name: servers-to-management-deny
    from_zone_ref: inst.trust_zone.servers
    to_zone_ref: inst.trust_zone.management
    action: drop
    log: true
    comment: Servers cannot initiate to management (uphill, R4)

  # Infrastructure admin access from LAN (user zone) to management zone
  # Required for Claude Code/operator workstations to reach srv-orangepi5 (10.0.99.20)
  - name: lan-to-management-admin
    from_zone_ref: inst.trust_zone.user
    to_zone_ref: inst.trust_zone.management
    action: accept
    src_vlan_ref: inst.vlan.lan
    log: false
    comment: Allow LAN to management for infrastructure admin access
