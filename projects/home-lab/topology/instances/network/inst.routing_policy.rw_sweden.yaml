@instance: inst.routing_policy.rw_sweden
@extends: obj.network.routing_policy.vpn_vlan
@group: network
@version: 1.0.0
source_id: policy-rw-sweden
status: active
notes: |
  Routes road-warrior traffic from wg1 (10.100.1.8) through AWG Sweden tunnel.

  Architecture:
    - Road-warrior connects to VPS wg1, gets IP 10.100.1.8
    - VPS forwards to MikroTik wg1
    - MikroTik marks traffic and routes to wg-awg-sweden
    - awg-proxy container adds AWG obfuscation
    - Traffic exits via VPN Sweden server

  Traffic flow:
    Device (10.100.1.8) -> VPS wg1 -> MikroTik wg1 ->
    mangle mark -> routing table awg-sweden ->
    wg-awg-sweden -> awg-proxy -> VPN Sweden -> Internet

# Policy identification
policy_name: rw-sweden-routing
policy_description: Route road-warrior 10.100.1.8 through AWG Sweden

# Source: specific IP address (not VLAN)
source_match:
  type: ip_address
  value: "10.100.1.8"

# Target: WireGuard interface (reuse existing AWG Sweden tunnel)
target_gateway:
  type: wireguard_interface
  value: wg-awg-sweden
  container_ref: docker-amneziawg-sweden

# Reuse existing awg-sweden routing table
routing_mark: "0x3A"
priority: 110
enabled: true

# MikroTik implementation details
mikrotik_config:
  # 1. Mangle rules to mark connections from 10.100.1.8
  mangle_rules:
    - chain: prerouting
      src_address: "10.100.1.8"
      dst_address: "!10.100.1.0/24"
      action: mark-connection
      new_connection_mark: vpn-rw-sweden
      passthrough: true
    - chain: prerouting
      connection_mark: vpn-rw-sweden
      src_address: "10.100.1.8"
      action: mark-routing
      new_routing_mark: awg-sweden
      passthrough: false

  # 2. Use existing awg-sweden routing table (no need to recreate)
  # routing_table is already created by inst.routing_policy.vpn_sweden

  # 3. Firewall rules for wg1 <-> wg-awg-sweden traffic
  firewall_rules:
    # Allow road-warrior egress to AWG tunnel
    - chain: forward
      action: accept
      in_interface: wg1
      out_interface: wg-awg-sweden
      src_address: "10.100.1.8"
      comment: "RW-Sweden: forward egress"
      priority: high
    # Allow tunnel ingress to road-warrior
    - chain: forward
      action: accept
      in_interface: wg-awg-sweden
      out_interface: wg1
      dst_address: "10.100.1.8"
      comment: "RW-Sweden: forward ingress"
      priority: high

  # NAT is handled by existing vpn_sweden policy (masquerade on wg-awg-sweden)

# Managed by
managed_by_ref: rtr-mikrotik-chateau
