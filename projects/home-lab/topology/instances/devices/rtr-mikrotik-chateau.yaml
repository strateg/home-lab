@instance: rtr-mikrotik-chateau
@extends: obj.mikrotik.chateau_lte7_ax
@group: devices
@version: 1.1.0
source_id: rtr-mikrotik-chateau
notes: ADR 0107 workload_defaults applied; WireGuard tunnel to OCI VPS active
firmware_ref: inst.firmware.routeros.7.arm64
os_refs:
- inst.os.routeros.7.arm64
power:
  source_ref: ups-main
  mode: dc
  voltage_v: 24
  max_watts: 21.5
observed_runtime:
  captured_at: "2026-08-10"
  identity: rtr-mikrotik-chateau
  routeros_version: "7.23.3"
  # serial_number and software_id are in SOPS secrets (secrets/instances/rtr-mikrotik-chateau.yaml)
  wan:
    primary_interface: ether1
    backup_interface: lte1
    dhcp_client_on_primary: true
    dynamic_ip: 192.168.0.17/24
    interface_list_wan: [ether1, lte1]
  lan:
    bridge_interface: bridge
    bridge_admin_mac: "{{ secrets.mac_addresses.bridge }}"  # stored in secrets/instances/rtr-mikrotik-chateau.yaml
    bridge_vlan_filtering: true  # Required for WiFi VLAN tagging
    bridge_ports: [ether2, ether3, ether4, ether5, wifi1, wifi2]
    gateway_ref: inst.vlan.lan
    dhcp_server: defconf
    dhcp_pool: 192.168.88.10-192.168.88.254
    dhcp_lease_time: 30m
    interface_list_lan: [bridge]
  vpn_vlan:
    vlan_ref: inst.vlan.vpn_germany
    vlan_id: 55
    interface: vlan55
    cidr: 192.168.55.0/24
    gateway: 192.168.55.1
    dhcp_pool: 192.168.55.100-192.168.55.200
    routing_policy_ref: inst.routing_policy.vpn_germany
    status: active
  vpn_amnezia_vlan:
    vlan_ref: inst.vlan.vpn_amnezia
    vlan_id: 57
    interface: vlan57
    cidr: 192.168.57.0/24
    gateway: 192.168.57.1
    dhcp_pool: 192.168.57.100-192.168.57.200
    routing_policy_ref: inst.routing_policy.vpn_amnezia
    container_ref: docker-amneziawg
    status: staged
  # ADR-0109/0110: VLANs now managed via inst.vlan.* instances
  # Security matrix rules generated from inst.security_matrix.mikrotik
  containers:
    bridge_interface: containers
    bridge_ip: 172.18.0.1/24
    veth_ports: [veth1, veth-awg-ru, veth-awg-se]
    registry_url: https://registry-1.docker.io
    running:
      - name: nginx:latest
        image: library/nginx:latest
        interface: veth1
        root_dir: /usb1/containers/nginx
        start_on_boot: true
    # AmneziaWG container with dedicated veth (isolated from container bridge)
    amneziawg:
      name: amneziawg
      image: catesin/awg-mikrotik:3.0
      interface: veth-awg-ru
      # Dedicated /30 subnet for AWG routing (not on container bridge)
      veth_address: 172.18.20.2/30
      veth_gateway: 172.18.20.1
      router_side_ip: 172.18.20.1/30
      root_dir: /usb1/containers/amneziawg
      config_dir: /usb1/containers/amneziawg/config
      start_on_boot: true
      logging: true
      container_ref: docker-amneziawg
      status: staged
  wifi:
    wifi1:
      band: 5ghz-ax
      ssid: "Chateau*"
      mode: ap
      channel_width: 20/40/80mhz
      frequency: 5220  # Channel 44 - not crowded, no DFS, per scan 2026-08-10
      security:
        authentication_types: [wpa2-psk, wpa3-psk]
        fast_transition: true
        fast_transition_over_ds: true
      datapath:
        name: dp-main-lan
        bridge: bridge
      status: running
    wifi2:
      band: 2ghz-ax
      ssid: "Chateau"
      mode: ap
      channel_width: 20/40mhz
      frequency: 2462  # Channel 11 - least congested per scan 2026-08-10
      security:
        authentication_types: [wpa2-psk, wpa3-psk]
        fast_transition: true
        fast_transition_over_ds: true
      datapath:
        name: dp-main-lan
        bridge: bridge
      status: running
    wifi_vpn_germany:
      name: wifi-vpn-germany
      master_interface: wifi1
      ssid: "VPN-Germany"
      mode: ap
      security: wpa2-psk
      vlan_id: 55
      datapath:
        name: dp-vpn-germany
        bridge: bridge
        vlan_id: 55
      # MAC whitelist - only these devices can connect to VPN-Germany
      # Access-list is bound to this interface only (not global)
      access_list:
        mode: whitelist  # only MACs in list can connect
        interface_binding: true  # rules apply only to this SSID
        devices_refs:
          - inst.device.boox_go103_lumi      # BOOX e-reader
          - inst.device.laptop_katana        # Laptop KATANA WiFi
          - inst.device.tv_sony_bravia       # Sony Bravia AJ9
          - inst.device.jolla-phone-2026     # Jolla Phone 2026
      status: bound
    # ADR-0109: Guest WiFi — VLAN 20, isolated (internet only)
    wifi_guest:
      name: wifi-guest
      master_interface: wifi1
      ssid: "Guest"
      mode: ap
      security: wpa2-psk
      vlan_id: 20
      datapath:
        name: dp-guest
        bridge: bridge
        vlan_id: 20
      status: staged  # Phase 2: add SSID after VLANs configured
    # ADR-0109: IoT WiFi — VLAN 30, isolated (no access to user/management)
    wifi_iot:
      name: wifi-iot
      master_interface: wifi2  # 2.4GHz for better IoT compatibility
      ssid: "IoT"
      mode: ap
      security: wpa2-psk
      vlan_id: 30
      datapath:
        name: dp-iot
        bridge: bridge
        vlan_id: 30
      status: staged
    # VPN-Russia WiFi — VLAN 57, routes through AmneziaWG container to Russia
    wifi_vpn_russia:
      name: wifi-vpn-russia
      master_interface: wifi1
      ssid: "VPN-Russia"
      mode: ap
      security: wpa2-psk
      passphrase: "VpnRussia2024!"
      vlan_id: 57
      datapath:
        name: dp-vpn-russia
        bridge: bridge
        vlan_id: 57
      status: active
    # VPN-Sweden WiFi — VLAN 58, routes through AmneziaWG container to Sweden
    wifi_vpn_sweden:
      name: wifi-vpn-sweden
      master_interface: wifi1
      ssid: "VPN-Sweden"
      mode: ap
      security: wpa2-psk
      passphrase: "VpnSweden2024!"
      vlan_id: 58
      datapath:
        name: dp-vpn-sweden
        bridge: bridge
        vlan_id: 58
      status: active
  dns:
    servers: [1.1.1.1, 8.8.8.8]
    dynamic_servers: [85.253.0.130, 85.253.0.2]
    allow_remote_requests: true
    cache_size_kib: 2048
    static_entries:
      - name: router.lan
        address: 192.168.88.1
  nat:
    # IMPORTANT: Order matters! Specific rules BEFORE general masquerade.
    #
    # Estonia chain exit: masquerade wg1 tunnel traffic to WAN (Estonian IP).
    # Traffic path: Jolla (wg1) -> VPS (wg1) -> Chateau (wg1) -> Internet
    # This rule MUST be first, otherwise general ether1 masquerade catches it.
    - chain: srcnat
      action: masquerade
      src_address: 10.100.1.0/24
      out_interface_list: WAN
      comment: "VPN Estonia chain exit (wg1 traffic via Chateau)"
    # AmneziaWG Russia container NAT: masquerade traffic going to Russia AWG container
    # Traffic path: VLAN 57 (192.168.57.x) -> veth-awg-ru -> container -> AWG tunnel
    - chain: srcnat
      action: masquerade
      out_interface: veth-awg-ru
      comment: "NAT for AmneziaWG Russia container traffic"
    # AmneziaWG Sweden container NAT: masquerade traffic going to Sweden AWG container
    # Traffic path: VLAN 58 (192.168.58.x) -> veth-awg-se -> container -> AWG tunnel
    - chain: srcnat
      action: masquerade
      out_interface: veth-awg-se
      comment: "NAT for AmneziaWG Sweden container traffic"
    # General masquerade for all other LAN traffic
    - chain: srcnat
      action: masquerade
      out_interface: ether1
    - chain: dstnat
      action: dst-nat
      protocol: tcp
      dst_port: 8080
      to_addresses: 172.18.0.2
      to_ports: 80
  firewall:
    input_rules: 5
    forward_rules: 24
    notes: ADR-0110 zone firewall rules managed via security_matrix
    # Zone policies now auto-generated from inst.security_matrix.mikrotik
    # Critical baseline rules that must exist regardless of zone firewall
    baseline_rules:
      - chain: forward
        action: accept
        in_interface_list: LAN
        out_interface_list: WAN
        comment: "Allow LAN to WAN"
  wireguard:
    configured: true
    interfaces:
      # wg0: Admin tunnel - trusted (LAN interface list)
      - name: wg0
        listen_port: null  # Client mode
        tunnel_ref: inst.tunnel.wg-home-to-oci
        tunnel_ip: 10.100.0.1/24
        persistent_keepalive: 25
        interface_list: LAN  # Trusted admin access
      # wg1: Exit tunnel - isolated (VPN_EXIT interface list)
      - name: wg1
        listen_port: null  # Client mode
        tunnel_ref: inst.tunnel.wg-exit
        tunnel_ip: 10.100.1.1/24
        persistent_keepalive: 25
        interface_list: VPN_EXIT  # ISOLATED from all VLANs
    # Interface list for isolated exit traffic
    interface_lists:
      VPN_EXIT:
        comment: "Isolated VPN exit traffic - no LAN access"
        members:
          - wg1
  services:
    webfig_http_port: 80
    webfig_https_enabled: true
    ssh_port: 22
    api_port: 8728
    api_ssl_port: 8729
  users:
    - name: admin
      group: full

# ADR 0107: Host-level workload defaults for RouterOS containers
# Note: RouterOS containers don't require os_refs - they run OCI images directly
workload_defaults:
  trust_zone_ref: inst.trust_zone.lan
  network:
    bridge_ref: inst.bridge.containers
    gateway: 172.18.0.1

# RouterOS v7 container support (MikroTik container package, not Docker Engine)
capabilities:
- cap.compute.runtime.container_host
- vendor.runtime.routeros.container
