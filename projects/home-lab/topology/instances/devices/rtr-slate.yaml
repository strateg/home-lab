@instance: rtr-slate
@extends: obj.glinet.slate_ax1800
@group: devices
@version: 1.1.0
source_id: rtr-slate
notes: |
  GL-AXT1800 reflashed from GL.iNet vendor firmware to upstream OpenWrt 25.12.5
  on 2026-10-11. Software refs repointed from the glinet.4x track to the
  stock.25_12 track accordingly.
firmware_ref: inst.firmware.openwrt.stock.25_12
os_refs:
- inst.os.openwrt.stock.25_12
power:
  source_ref: pdu-rack
  outlet_ref: outlet_02

# ============================================================================
# OBSERVED RUNTIME
# Read off the device over SSH on 2026-10-11. Facts, not intent: this records
# what the box currently is, so later phases can diff intent against it.
# ============================================================================

observed_runtime:
  captured_at: "2026-10-11"
  identity: OpenWrt            # stock default hostname, not yet set to rtr-slate
  openwrt_version: 25.12.5
  openwrt_build: r33051-f5dae5ece4
  target: qualcommax/ipq60xx
  architecture: aarch64_cortex-a53
  kernel_version: 6.12.94

  # Three independent nss-dp/edma netdevs; no DSA switch and no eth0 CPU port.
  interfaces:
    wan:
      device: wan
      proto: dhcp
      link: up
      address: 192.168.0.17/24   # dynamic, from the upstream main router
      gateway: 192.168.0.1
      notes: Uplink to the same upstream router that rtr-mikrotik-chateau's WAN uses
    lan:
      device: br-lan
      proto: static
      address: 192.168.1.1/24
      bridge_ports: [lan1, lan2]
      link_up_ports: [lan2]
      notes: lan2 patched into rtr-mikrotik-chateau for management reachability
    wan6:
      device: wan
      proto: dhcpv6

  firewall_baseline:
    defaults:
      input: REJECT
      output: ACCEPT
      forward: REJECT
    zones:
      lan: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [lan] }
      wan: { input: REJECT, output: ACCEPT, forward: DROP, network: [wan, wan6], masq: true, mtu_fix: true }
    forwardings:
      - { src: lan, dest: wan }
    notes: |
      Stock baseline. No terminal drop-all rule exists and none is required:
      firewall4 renders defaults.forward=REJECT as an nftables `policy drop`
      and each zone chain self-terminates. ADR 0110 §4.4's mandatory final
      drop-all is a RouterOS default-accept compensation and must not be ported.
      Note zone lan ships input ACCEPT - router services are open to the LAN
      side until zone.input is modeled explicitly.

  # Input for the Phase 8 adoption ledger. Named sections adopt in place
  # without mutating the router; anonymous ones adopt by renaming to a ULID,
  # which does mutate it.
  uci_sections:
    named:
      - network.lan
      - network.wan
      - network.wan6
      - network.loopback
      - network.globals
      - dhcp.lan
      - dhcp.wan
      - dhcp.odhcpd
      - system.ntp
    anonymous:
      - network @device (br-lan)
      - firewall @defaults[0]
      - firewall @zone[0] (lan)
      - firewall @zone[1] (wan)
      - firewall @forwarding[0]
      - system @system[0]
    notes: Every firewall section is anonymous in stock config - see report P7.6

  uapi:
    installed_version: 3.1.0
    endpoint: https://192.168.1.1/api/v3
    source: project feed (https://openwrt-iac.github.io/feed/), RSA-4096 signed
    token_name: terraform
    token_scope: "*:rw"
    token_allowed_cidr: 192.168.1.0/24
    healthz: ok   # ubus, uci, lock_dir, time_sync all ok
    notes: |
      Bearer token lives in projects/home-lab/secrets/instances/rtr-slate.yaml
      (SOPS, both age recipients). Installed from the feed rather than a local
      .apk on purpose: the file form writes a checksum-pinned /etc/apk/world
      entry that silently freezes future `apk upgrade`.

  # Hand-applied, not yet expressed in topology. Both must be re-expressed or
  # reverted once the staging cabling changes (see report P0.4b).
  staging_deviations:
    - dhcp.lan ignore=1, dhcpv6=disabled, ra=disabled - rtr-slate was acting as
      a second DHCP/RA server on Chateau's LAN through the bridged lan2 cable
    - sysntpd restarted to sync the clock, which was stuck at the build date

# ============================================================================
# RUNTIME INTENT
# Desired state. Deliberately a separate block from observed_runtime above.
#
# On rtr-mikrotik-chateau the authored intent lives *inside* observed_runtime -
# the MikroTik compilers read instance_data.observed_runtime.wifi and so on -
# so nothing in that model distinguishes "what we want" from "what we saw".
# That naming debt is not propagated here: observed_runtime holds facts read
# off the device, runtime_intent holds what should be true, and a drift report
# is the difference between them. Recorded as a finding in the SPC report.
# ============================================================================

runtime_intent:

  # --------------------------------------------------------------------------
  # UPLINK - the venue's network, outside the perimeter
  # --------------------------------------------------------------------------
  uplink:
    # Primary: associate to the venue AP as a station. radio1 (2.4 GHz) carries
    # it so that radio0 stays STA-free - see the wireless block for why that
    # choice is load-bearing rather than cosmetic.
    # Preference between uplinks, lowest wins. netifd installs a default route
    # per live uplink, so without distinct metrics the kernel picks by
    # insertion order and the active uplink is whatever came up first rather
    # than what was chosen (E9919).
    #
    # The order encodes deliberateness: a cable is a deliberate act and the
    # most predictable link, so it outranks the station, which is the standing
    # fallback. A tethered phone, when modelled, belongs between them - also
    # deliberate, but on someone's battery.
    primary:
      interface: wwan
      proto: dhcp
      wireless_iface: uplink
      trust_zone_ref: inst.trust_zone.untrusted
      metric: 30
    # Wired venue uplink when a room offers Ethernet. Same zone: a cable in a
    # hotel is no more trusted than its WiFi.
    wired:
      interface: wan
      device: wan
      proto: dhcp
      trust_zone_ref: inst.trust_zone.untrusted
      enabled: true
      metric: 10
    # Captive portals answer with RFC1918 addresses, which dnsmasq's rebind
    # protection discards by default - the portal then never resolves.
    captive_portal:
      rebind_protection: false
      notes: |
        Portal authentication happens from a client device through NAT, so no
        router-side input rule is needed: the router's own output policy is
        ACCEPT and the venue zone's forward path for that client is the normal
        one. No client zone gets a hole punched into it for the portal.
  # --------------------------------------------------------------------------
  # MANAGEMENT PATH
  #
  # Declared separately from the client segments and from the uplink because it
  # is neither: it is the interface the uapi endpoint arrives on, and the one
  # interface generation must never rewrite. A write that reconfigures the
  # interface its own request came in on never returns a response, so Terraform
  # records nothing and the device is left in an unknown state with no way back
  # except physical access. E9904 refuses any plan that would touch it.
  #
  # The address is the stock 192.168.1.1/24 that the uapi token's allowed_cidr
  # and the operator's secondary address both depend on. Moving it to the
  # 10.77.x plan is a deliberate guarded transition - stage, change, verify,
  # re-mint the token - not something an ordinary apply may do as a side effect.
  # --------------------------------------------------------------------------
  management:
    interface: lan
    device: br-lan
    bridge_ports: [lan1, lan2]
    address: 192.168.1.1/24
    proto: static
    trust_zone_ref: inst.trust_zone.management
    immutable: true
    endpoint_arrives_here: true
    # Zone input is REJECT like every other zone, so the services that must
    # survive are listed rather than inherited. Without these two the first
    # apply would lock the operator out of the device it was applied to.
    input_services:
      - ssh
      - uapi
    notes: |
      DHCP is deliberately absent: dhcp.lan was switched off by hand during
      staging because this bridge reaches Chateau's LAN through the lan2 cable
      and rtr-slate was answering DHCP there. Re-expressing that here keeps the
      generated state and the hand-applied state in agreement.

  # --------------------------------------------------------------------------
  # WIRELESS
  #
  # Role split is driven by netifd/hostapd behaviour read from source, not by
  # the 2.4 GHz radio's reputation:
  #
  # Any sta interface on a phy sets ap_start_disabled, so hostapd receives
  # start_disabled=1 and the APs on that phy do not beacon until the STA
  # associates. wpa_supplicant then drives hostapd over ubus apsta_state and
  # calls iface.stop() on DISCONNECTED/SCANNING - taking those APs down and
  # deauthing their clients on every uplink scan or roam. Keeping radio0
  # STA-free is therefore worth more than avoiding radio1.
  #
  # The 2.4 GHz defects reported upstream for this board do not block the STA
  # role: the "-95 / Not supported" lines are cosmetic noise from an
  # unredirected iw call (ath11k has no set_coverage_class op), and the
  # beacon-loss assert was fixed in 25.12.5 by commit a62b5fe71c.
  # --------------------------------------------------------------------------
  wireless:
    radios:
      radio0:
        band: 5g
        # Fixed non-DFS channel: starts immediately with no CAC wait, and this
        # radio never carries an STA so it has no upstream channel to follow.
        channel: 36
        htmode: HE80
        role: ap_only
        # Mandatory, not stylistic: regdomain 00 marks every 5 GHz range NO-IR
        # in wireless-regdb, so a 5 GHz AP never beacons without it (E9908).
        # Set to the home regdomain; travelling legally implies matching the
        # venue's, and the permitted channel set differs between them.
        country: EE
      radio1:
        band: 2g
        # auto on a station-bearing radio, because any other value would be
        # fiction: mac80211_setup_supplicant passes an explicitly empty
        # frequency for mode=sta, so the phy ends up on whatever channel the
        # station associates to and a declared channel is simply ignored
        # (W9904). Rendered as 0 - uapi_wireless_device.channel is typed
        # Number, and netifd's `""|0|auto` case makes 0 the auto spelling.
        channel: auto
        # Drops 11ax on the weaker radio. Community-reported mitigation, not
        # verified in source - recorded as such rather than as a known fix.
        htmode: HT20
        role: sta_uplink
        country: EE

    interfaces:
      # ---- client APs, all on radio0 ----
      - name: ap_home
        device: radio0
        mode: ap
        ssid: Slate-Home
        encryption: sae-mixed
        network_ref: inst.vlan.slate_home
        enabled: true
        notes: Full-tunnel mode. Egress only via wg_home.

      - name: ap_split
        device: radio0
        mode: ap
        ssid: Slate-Split
        encryption: sae-mixed
        network_ref: inst.vlan.slate_split
        enabled: true
        notes: Split mode. Home over the tunnel, internet direct via the venue.

      # The remaining SSIDs are declared and parked. A wifi-iface with
      # disabled '1' is dropped at parse time, so a parked section costs
      # nothing - and the ath11k leak rate tracks cumulative RX churn, which
      # makes fewer live SSIDs a real mitigation rather than tidiness.
      - name: ap_de
        device: radio0
        mode: ap
        ssid: VPN-Germany
        encryption: sae-mixed
        network_ref: inst.vlan.slate_de
        enabled: false

      - name: ap_ru
        device: radio0
        mode: ap
        ssid: VPN-Russia
        encryption: sae-mixed
        network_ref: inst.vlan.slate_ru
        enabled: false

      - name: ap_se
        device: radio0
        mode: ap
        ssid: VPN-Sweden
        encryption: sae-mixed
        network_ref: inst.vlan.slate_se
        enabled: false

      - name: ap_guest
        device: radio0
        mode: ap
        ssid: Slate-Guest
        encryption: sae-mixed
        network_ref: inst.vlan.slate_guest
        enabled: false

      # ---- uplink station ----
      - name: uplink
        device: radio1
        mode: sta
        network: wwan
        # SSID and credentials are per venue and deliberately absent from
        # topology: they are neither durable infrastructure nor secrets worth
        # a SOPS round trip for a coffee shop.
        ssid: null
        encryption: null
        enabled: true

      # Parked station for venues that offer 5 GHz only. Enabling it converts
      # radio0 to apsta and brings the start_disabled/stop-on-scan coupling
      # described above onto every client SSID - a venue-specific fallback,
      # never the standing config (W9901).
      - name: uplink5
        device: radio0
        mode: sta
        network: wwan
        ssid: null
        encryption: null
        enabled: false

    # Only one station interface may exist per phy ('#{ managed } <= 1'); two
    # is the misconfiguration behind the upstream "Device is not active"
    # reports. E9910 enforces it, which is why uplink5 stays parked rather
    # than being a second live station.
    station_limit_per_radio: 1

  # --------------------------------------------------------------------------
  # WIREGUARD - one interface per destination
  #
  # Chosen over a single interface with several addresses and SNAT per segment:
  # this is a router, so client subnets are routed and the client source IP
  # survives to the far end, which keeps per-client policy possible at home and
  # keeps the address domains meaningful.
  #
  # Consequence worth stating, because it changes the neighbours' config: the
  # source address arriving at the VPS is the *client subnet* (10.77.57.x), not
  # this device's tunnel IP. So the VPS policy rules and both peers' AllowedIPs
  # key on the advertised subnet, and Chateau's existing rw_* policies
  # generalise from a /32 match to a subnet match.
  #
  # AmneziaWG deliberately stays at home for the chained exits: it is absent
  # from the configured feeds for this target, a third-party kmod would be
  # pinned to kernel 6.12.94, and a device that travels should not carry the
  # country credentials at all.
  # --------------------------------------------------------------------------
  wireguard:
    configured: true
    interfaces:
      - name: wg_home
        tunnel_ref: inst.tunnel.wg-home-to-oci
        tunnel_ip: 10.100.0.4/24
        persistent_keepalive: 25
        mtu: 1420
        advertises:
          - 10.77.1.0/24
          - 10.77.2.0/24
        # Which remote zones this interface is the egress path to. Stated
        # rather than inferred: a permit to a zone hosted elsewhere lowers to a
        # rule whose dest is the *local* zone the traffic leaves through, and
        # nothing in the zone plan says which interface reaches what. The
        # alternative was guessing from tunnel routes, which couples the
        # firewall's shape to a routing table the compiler does not read.
        reaches_zone_refs:
          - inst.trust_zone.servers
        # Which segments take their DEFAULT route through this tunnel - the
        # routing half of D2's full-tunnel mode, and the half that was missing.
        #
        # Not inferable from `advertises`: that list is the reverse direction
        # (prefixes the far side must route back to us), and it includes
        # slate_split precisely because a split-mode client still reaches home
        # over this tunnel while its internet stays on the venue uplink. Using
        # `advertises` here would have given slate_split a default route into
        # the tunnel and silently destroyed split mode.
        #
        # A segment absent from every `default_route_for` falls through to the
        # main table and egresses via the venue - which is exactly what
        # Slate-Split and Slate-Guest want.
        default_route_for:
          - inst.vlan.slate_home
        # Policy routing is required, not stylistic. Both modes have
        # destination 0.0.0.0/0, so a destination-based default route cannot
        # separate them; only a source-based rule can. This is the table the
        # rule points at. 100+ avoids netifd's own low-numbered interface
        # tables and the reserved 253/254/255.
        route_table: 101
        trust_zone_ref: inst.trust_zone.vpn_exit
        enabled: true
        notes: |
          Trusted path home. Peer and keys already exist in
          inst.tunnel.wg-home-to-oci; only the advertised subnets and the
          servers/management routes are new.

      - name: wg_de
        default_route_for:
          - inst.vlan.slate_de
        route_table: 155
        tunnel_ref: inst.tunnel.wg-exit
        tunnel_ip: 10.100.1.10/32
        persistent_keepalive: 25
        mtu: 1420
        advertises:
          - 10.77.55.0/24
        exit_mode: direct
        exit_country: DE
        trust_zone_ref: inst.trust_zone.vpn_exit
        enabled: false
        notes: Single encapsulation - terminates at the VPS, no hop through home.

      - name: wg_ru
        default_route_for:
          - inst.vlan.slate_ru
        route_table: 157
        tunnel_ref: inst.tunnel.wg-exit
        tunnel_ip: 10.100.1.11/32
        persistent_keepalive: 25
        # Two encapsulations plus AmneziaWG junk padding downstream. Estimate
        # pending a DF-ping measurement, same as the segment MTU (W9902).
        mtu: 1340
        advertises:
          - 10.77.57.0/24
        exit_mode: chained
        exit_country: RU
        chained_via_ref: rtr-mikrotik-chateau
        upstream_tunnel_ref: docker-amneziawg-russia
        trust_zone_ref: inst.trust_zone.vpn_exit
        enabled: false

      - name: wg_se
        default_route_for:
          - inst.vlan.slate_se
        route_table: 158
        tunnel_ref: inst.tunnel.wg-exit
        tunnel_ip: 10.100.1.12/32
        persistent_keepalive: 25
        mtu: 1340
        advertises:
          - 10.77.58.0/24
        exit_mode: chained
        exit_country: SE
        chained_via_ref: rtr-mikrotik-chateau
        upstream_tunnel_ref: docker-amneziawg-sweden
        trust_zone_ref: inst.trust_zone.vpn_exit
        enabled: false

    # Policy routing selects the egress tunnel by source subnet via ip rule.
    # No packet marking is needed, unlike Chateau's mangle-based approach,
    # because each segment already has its own WireGuard interface.
    routing:
      selector: source_subnet
      marks: none

  # --------------------------------------------------------------------------
  # SERVICES
  # --------------------------------------------------------------------------
  services:
    # Needed or every radio reading through LuCI and uapi is untrustworthy.
    packages:
      - iwinfo
      - rpcd-mod-iwinfo
      - kmod-wireguard
      - wireguard-tools
    # The ath11k memory leak is unfixed upstream (both PRs open), has no module
    # parameter, and `wifi down` frees nothing - only a module reload reclaims
    # it. Deliberately recorded as an Ansible-owned concern: this is OS/runtime
    # territory, and ADR 0119 D6 keeps Terraform on infrastructure. It must not
    # end up in the uapi generator.
    memory_watchdog:
      owner: ansible
      trigger: MemAvailable threshold
      action: ath11k module reload
      status: not_implemented

  # --------------------------------------------------------------------------
  # ADOPTION LEDGER
  #
  # Sections that already exist in uci on the device and must be ADOPTED rather
  # than created. Terraform `import {}` blocks are generated from this list.
  #
  # Why this cannot be inferred: the provider refuses duplicate-name creation
  # with 422 conflict (uapi >= 2.2.1), so a section left out of this ledger
  # fails the first apply, and a section listed here that does not exist fails
  # the import. Both are loud failures at plan/apply time rather than drift,
  # which is the reason the ledger is authored data and not a guess.
  #
  # Only NAMED sections appear here. Adoption of a named section is
  # non-mutating since uapi 2.2.0 - it binds in place and keeps the name. An
  # anonymous `cfgXXXXXX` section adopts by being RENAMED to a ULID, which
  # mutates the router, so anonymous sections are never imported (W9903): the
  # stock ones are removed by hand before the first apply and recreated from
  # this topology under explicit names.
  #
  # Every stock firewall section and every stock wifi-iface is anonymous, which
  # is why none of them is listed.
  #
  # Measured on the device 2026-10-12, which corrected this list: the stock
  # bridge is `network.cfg030f15` - an ANONYMOUS section whose `name` option is
  # 'br-lan'. A kernel device name is not a uci section name, and only the
  # latter can be imported; `terraform plan` refused it with "no resource found
  # at /network/devices/br-lan". It is no longer listed, and the bridge is left
  # unmanaged - see the compiler for why both ways of managing it would
  # interrupt the path an apply arrives over.
  #
  # Evidence for the four below, from the device's own board support rather
  # than from assumption - target/linux/qualcommax/ipq60xx/base-files/etc/
  # board.d/02_network does
  #   glinet,gl-axt1800) ucidef_set_interfaces_lan_wan "lan1 lan2" "wan"
  # which yields named `lan` and `wan` interfaces over a `br-lan` device, and
  # `wifi detect` names the radios radio0/radio1.
  #
  # MUST be reconciled against the live device before the first apply. The
  # reconciliation step is `terraform plan`: a wrong entry surfaces there as an
  # import failure, not as a change to the router.
  # --------------------------------------------------------------------------
  adoption:
    # Confirmed by `terraform plan` against the live device on 2026-10-12:
    # 4 to import, 77 to add, 2 to change, 0 to destroy, no errors. The four
    # imports bind in place - `lan` and `wan` with no diff at all.
    reconciled_against_device: true
    sections:
      - resource: uapi_network_interface
        id: lan
      - resource: uapi_network_interface
        id: wan
      - resource: uapi_wireless_device
        id: radio0
      - resource: uapi_wireless_device
        id: radio1
