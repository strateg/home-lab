@instance: inst.device.tv-sony-bravia
@extends: obj.device.smart_tv
@group: devices
@version: 1.1.0
source_id: tv-sony-bravia-aj9
status: active
notes: |
  Sony Bravia AJ9 Android TV.
  Connected via Ethernet to Chateau ether2, default LAN (Estonian exit).
  For German streaming: use WiFi SSID "VPN-Germany" or VPN app on TV.

# Device identification
device_name: "Sony Bravia AJ9"
manufacturer: Sony
model: Bravia AJ9 (XR-55A90J)

# Network configuration
# MAC addresses stored in secrets/instances/tv-sony-bravia.yaml
secrets_ref: secrets.instances.tv-sony-bravia

# Primary connection: Ethernet (ether2 on Chateau)
connection_type: ethernet
physical_port: ether2
router_ref: rtr-mikrotik-chateau

# Default LAN - Estonian exit (direct via ISP)
vlan_ref: inst.vlan.lan

# IP assignment via DHCP
ip_address: 192.168.88.215
dhcp_static_lease: true

# Streaming services used
streaming_services:
  - netflix
  - youtube
  - amazon_prime
  - ard_mediathek
  - zdf_mediathek
  - arte

# VPN options for German content
vpn_options:
  wifi_ssid: "VPN-Germany"  # VLAN 55, routes through wg0 to VPS Frankfurt
  native_vpn_app: true      # TV supports VPN apps (Android TV)
