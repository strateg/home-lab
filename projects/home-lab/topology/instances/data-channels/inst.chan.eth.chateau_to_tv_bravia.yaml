@instance: inst.chan.eth.chateau_to_tv_bravia
@extends: obj.network.ethernet_channel
@group: data-channels
@version: 1.0.0
source_id: link-rtr-mikrotik-tv-bravia
notes: |
  Logical ethernet channel for Chateau to Sony Bravia TV.
  TV on default LAN (Estonian exit via ISP).
endpoint_a:
  device_ref: rtr-mikrotik-chateau
  port: ether2
endpoint_b:
  device_ref: inst.device.tv-sony-bravia
  port: ethernet
link_ref: inst.ethernet_cable.chateau_to_tv_bravia
negotiated_speed_mbps: 1000
admin_state: up
