@instance: inst.chan.eth.chateau_to_orangepi5
@extends: obj.network.ethernet_channel
@group: data-channels
@version: 1.0.0
source_id: link-rtr-mikrotik-srv-orangepi5
notes: |
  Logical ethernet channel for Chateau to Orange Pi wired uplink.
  Uses USB-Ethernet adapter (onboard end1 PHY damaged).
endpoint_a:
  device_ref: rtr-mikrotik-chateau
  port: ether3
endpoint_b:
  device_ref: srv-orangepi5
  port: end1  # actual: USB adapter inst.peripheral.usb_hub_eth.bluecloud-001
link_ref: inst.ethernet_cable.chateau_to_orangepi5
negotiated_speed_mbps: 1000
admin_state: up
