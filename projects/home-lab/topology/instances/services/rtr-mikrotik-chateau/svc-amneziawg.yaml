@instance: svc-amneziawg
@extends: obj.service.amneziawg
@group: services
@version: 1.0.0
source_id: svc-amneziawg-russia
notes: |
  AmneziaWG VPN client for obfuscated internet exit to Russia.
  Runs as awg-proxy container on MikroTik Chateau, serves VLAN 57 clients.
  Uses native WireGuard + awg-proxy architecture for better performance.

  Architecture (v2.0.0 - awg-proxy):
    - MikroTik native WireGuard handles encryption (wg-awg-russia)
    - awg-proxy container adds AWG 3.0 obfuscation
    - Traffic routes directly to WG interface

port: 51825
protocol: udp
trust_zone_ref: inst.trust_zone.vpn_tunnel
vpn_type: amneziawg
@description: AmneziaWG VPN client for Russia exit (awg-proxy)
critical: false
status: active

runtime:
  type: container
  target_ref: rtr-mikrotik-chateau
  container_ref: docker-amneziawg-russia
  network_binding_ref: inst.vlan.vpn_amnezia

features:
  - DPI evasion via packet obfuscation
  - Censorship bypass
  - WireGuard-compatible but obfuscated
  - Isolated VLAN routing
  - Native WireGuard performance
  - AWG 3.0 header protection

# External VPN server connection details
vpn_server:
  endpoint_ref: secrets.amneziawg_russia.endpoint
  awg_params_ref: secrets.amneziawg_russia.params

# Serves this VLAN
serves_vlan_ref: inst.vlan.vpn_amnezia

# Routing policy
routing_policy_ref: inst.routing_policy.vpn_amnezia
