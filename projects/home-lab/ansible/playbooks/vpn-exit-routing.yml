---
# VPN Exit Routing Playbook
# Configures VPS for automatic exit routing based on source IP:
#   - 10.100.1.3 (vpn-germany) → Germany exit via ens3 (direct)
#   - 10.100.1.6 (vpn-estonia) → Estonia exit via Chateau WAN
#   - 10.100.1.7 (vpn-russia) → Russia exit via Chateau AWG Russia
#   - 10.100.1.8 (vpn-sweden) → Sweden exit via Chateau AWG Sweden
#
# Usage:
#   cd projects/home-lab/ansible
#   ansible-playbook -i inventory/production/cloud-hosts.yml playbooks/vpn-exit-routing.yml
#   ansible-playbook -i inventory/production/cloud-hosts.yml playbooks/vpn-exit-routing.yml --tags russia
#   ansible-playbook -i inventory/production/cloud-hosts.yml playbooks/vpn-exit-routing.yml --tags sweden

- name: Configure VPN exit routing on VPS gateway
  hosts: vpn_gateways
  gather_facts: true
  become: true

  vars:
    # Tunnel networks
    wg0_network: "10.100.0.0/24"
    wg1_network: "10.100.1.0/24"

    # Jolla tunnel IPs per profile (all on wg1)
    jolla_germany_ip: "10.100.1.3"   # vpn-germany → direct exit via VPS
    jolla_estonia_ip: "10.100.1.6"   # vpn-estonia → chain via Chateau WAN
    jolla_russia_ip: "10.100.1.7"    # vpn-russia → chain via Chateau AWG Russia
    jolla_sweden_ip: "10.100.1.8"    # vpn-sweden → chain via Chateau AWG Sweden

    # Chateau (chained exit gateway on wg1)
    chateau_tunnel_ip: "10.100.1.1"

    # Routing tables for chained exits
    chain_routes:
      estonia:
        table_name: "estonia_chain"
        table_id: 100
        source_ip: "10.100.1.6"
      russia:
        table_name: "russia_chain"
        table_id: 101
        source_ip: "10.100.1.7"
      sweden:
        table_name: "sweden_chain"
        table_id: 102
        source_ip: "10.100.1.8"

    # Interfaces
    public_interface: "ens3"
    wireguard_interface: "wg0"
    exit_wireguard_interface: "wg1"

  pre_tasks:
    - name: Verify WireGuard interface exists
      ansible.builtin.command: ip link show {{ wireguard_interface }}
      register: wg_check
      changed_when: false
      failed_when: wg_check.rc != 0

    - name: Display configuration summary
      ansible.builtin.debug:
        msg: |
          VPN Exit Routing Configuration:
            Host: {{ inventory_hostname }}
            WireGuard admin: {{ wireguard_interface }}
            WireGuard exit: {{ exit_wireguard_interface }}
            Public: {{ public_interface }}

            Automatic routing by source IP (wg1):
              {{ jolla_germany_ip }} → Germany exit (direct via {{ public_interface }})
              {{ jolla_estonia_ip }} → Estonia exit (chain via Chateau WAN)
              {{ jolla_russia_ip }} → Russia exit (chain via Chateau AWG Russia)
              {{ jolla_sweden_ip }} → Sweden exit (chain via Chateau AWG Sweden)

  tasks:
    # =========================================================================
    # IP Forwarding
    # =========================================================================
    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    # =========================================================================
    # Routing Tables for Chained Exits
    # =========================================================================
    - name: Add chain routing tables to rt_tables
      ansible.builtin.lineinfile:
        path: /etc/iproute2/rt_tables
        line: "{{ item.value.table_id }} {{ item.value.table_name }}"
        regexp: "^{{ item.value.table_id }}\\s+"
        state: present
        create: true
        mode: "0644"
      loop: "{{ chain_routes | dict2items }}"
      loop_control:
        label: "{{ item.key }}: {{ item.value.table_name }}"

    # =========================================================================
    # iptables Rules
    # =========================================================================
    - name: Install iptables-persistent
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true

    - name: Allow forwarding from wg0 to public interface
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wireguard_interface }}"
        out_interface: "{{ public_interface }}"
        jump: ACCEPT
        comment: "VPN exit - wg0 to internet"
      notify: Save iptables rules

    - name: Allow established/related back to wg0
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ public_interface }}"
        out_interface: "{{ wireguard_interface }}"
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "VPN exit - return traffic"
      notify: Save iptables rules

    - name: Allow wg0 hairpin (peer-to-peer and Estonia chain)
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wireguard_interface }}"
        out_interface: "{{ wireguard_interface }}"
        jump: ACCEPT
        comment: "VPN hairpin - peer-to-peer and Estonia chain"
      notify: Save iptables rules

    - name: Masquerade wg1 tunnel traffic to internet (direct Germany exit)
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ wg1_network }}"
        out_interface: "{{ public_interface }}"
        jump: MASQUERADE
        comment: "VPN wg1 Germany exit - masquerade to internet"
      notify: Save iptables rules

    # =========================================================================
    # WireGuard wg1 Interface for Chained Exits
    # =========================================================================
    - name: Deploy wg1 config for chained exits
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../../generated/home-lab/wireguard/vps-wg1.conf"
        dest: /etc/wireguard/wg1.conf
        mode: "0600"
      notify: Restart wg1

    - name: Start wg1 interface (async - Chateau may not be connected yet)
      ansible.builtin.shell: |
        systemctl enable wg-quick@wg1 || true
        wg-quick up wg1 2>&1 || echo "wg1 started (peer may not be connected)"
      changed_when: true
      async: 10
      poll: 0
      register: wg1_start

    - name: Wait briefly for wg1
      ansible.builtin.pause:
        seconds: 3

    # =========================================================================
    # Policy Routing for All Chained Exits (via wg1 to Chateau)
    # =========================================================================
    - name: Create systemd service for chain routing at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/vpn-chain-routing.service
        mode: "0644"
        content: |
          [Unit]
          Description=VPN Chain Routing (Estonia/Russia/Sweden)
          After=wg-quick@wg1.service
          Wants=wg-quick@wg1.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/bash -c '\
            {% for name, route in chain_routes.items() %}
            ip route replace default dev {{ exit_wireguard_interface }} table {{ route.table_name }} 2>/dev/null || true; \
            ip rule show | grep -q "from {{ route.source_ip }} lookup {{ route.table_name }}" || \
              ip rule add from {{ route.source_ip }} lookup {{ route.table_name }} priority {{ route.table_id }}; \
            {% endfor %}
            echo "Chain routing configured"'
          ExecStop=/bin/bash -c '\
            {% for name, route in chain_routes.items() %}
            ip rule del from {{ route.source_ip }} lookup {{ route.table_name }} 2>/dev/null || true; \
            {% endfor %}
            echo "Chain routing removed"'

          [Install]
          WantedBy=multi-user.target
      notify: Enable vpn-chain-routing service

    - name: Apply chain routing rules now
      ansible.builtin.shell: |
        {% for name, route in chain_routes.items() %}
        ip route replace default dev {{ exit_wireguard_interface }} table {{ route.table_name }} 2>/dev/null || true
        ip rule show | grep -q "from {{ route.source_ip }} lookup {{ route.table_name }}" || \
          ip rule add from {{ route.source_ip }} lookup {{ route.table_name }} priority {{ route.table_id }}
        {% endfor %}
      changed_when: true

    # =========================================================================
    # iptables rules for wg1 <-> wg1 hairpin (chain traffic)
    # =========================================================================
    - name: Allow wg1 hairpin forwarding (chain to Chateau and back)
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ exit_wireguard_interface }}"
        out_interface: "{{ exit_wireguard_interface }}"
        jump: ACCEPT
        comment: "VPN chain - wg1 hairpin for Chateau routing"
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.shell: |
        iptables-save > /etc/iptables/rules.v4
      changed_when: true

    - name: Restart wg1
      ansible.builtin.systemd:
        name: wg-quick@wg1
        state: restarted
        daemon_reload: true

    - name: Restart networkd-dispatcher
      ansible.builtin.systemd:
        name: networkd-dispatcher
        state: restarted
        daemon_reload: true

    - name: Enable vpn-chain-routing service
      ansible.builtin.systemd:
        name: vpn-chain-routing
        enabled: true
        daemon_reload: true

    - name: Reload WireGuard
      ansible.builtin.shell: |
        wg syncconf wg0 <(wg-quick strip wg0)
      args:
        executable: /bin/bash
      changed_when: true

  post_tasks:
    - name: Verify routing configuration
      ansible.builtin.shell: |
        echo "=== IP Rules ==="
        ip rule show | grep -E "chain" || echo "No chain rules found"
        echo ""
        echo "=== Chain Routing Tables ==="
        {% for name, route in chain_routes.items() %}
        echo "--- {{ name }} ({{ route.table_name }}) ---"
        ip route show table {{ route.table_name }} 2>/dev/null || echo "Table empty or not found"
        {% endfor %}
        echo ""
        echo "=== WireGuard wg1 Peers ==="
        wg show wg1 allowed-ips 2>/dev/null || echo "wg1 not up"
      register: routing_status
      changed_when: false

    - name: Display routing status
      ansible.builtin.debug:
        msg: "{{ routing_status.stdout }}"

    - name: Display usage instructions
      ansible.builtin.debug:
        msg: |
          VPN Exit Routing configured successfully!

          Automatic routing by source IP on wg1:

            vpn-germany.conf (Address: {{ jolla_germany_ip }})
              → Traffic exits via German IP ({{ public_interface }})

            vpn-estonia.conf (Address: {{ jolla_estonia_ip }})
              → Chain via Chateau ({{ chateau_tunnel_ip }}) → Estonian WAN IP

            vpn-russia.conf (Address: {{ jolla_russia_ip }})
              → Chain via Chateau ({{ chateau_tunnel_ip }}) → AWG Russia → Russian IP

            vpn-sweden.conf (Address: {{ jolla_sweden_ip }})
              → Chain via Chateau ({{ chateau_tunnel_ip }}) → AWG Sweden → Swedish IP

          Just import the desired .conf profile on Jolla and connect!

  tags:
    - vpn
    - routing
    - exit
