---
# WireGuard Deploy Playbook
# Deploys pre-generated WireGuard configurations from topology compiler
#
# Usage:
#   cd projects/home-lab/ansible
#   ansible-playbook -i inventory/production/cloud-hosts.yml playbooks/wireguard-deploy.yml
#
# The configuration files are generated by topology compiler and located in:
#   generated/home-lab/wireguard/

- name: Deploy WireGuard configuration to VPS gateway
  hosts: vpn_gateways
  gather_facts: true
  become: true

  vars:
    # Path relative to repository root
    repo_root: "{{ playbook_dir | dirname | dirname | dirname | dirname }}"
    wireguard_config_src: "{{ repo_root }}/generated/home-lab/wireguard/vps-wg0.conf"
    wireguard_config_dest: /etc/wireguard/wg0.conf
    wireguard_interface: wg0

  pre_tasks:
    - name: Verify connectivity
      ansible.builtin.ping:

    - name: Display target host info
      ansible.builtin.debug:
        msg: |
          Deploying WireGuard configuration:
            Host: {{ inventory_hostname }}
            IP: {{ ansible_host | default(ansible_default_ipv4.address) }}
            Source: {{ wireguard_config_src }}

    - name: Check source config exists
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ wireguard_config_src }}"
      register: config_stat

    - name: Fail if config not found
      ansible.builtin.fail:
        msg: "WireGuard config not found: {{ wireguard_config_src }}. Run topology compiler first."
      when: not config_stat.stat.exists

  tasks:
    - name: Ensure WireGuard is installed
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
        state: present
        update_cache: true

    - name: Create WireGuard config directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Backup existing configuration
      ansible.builtin.copy:
        src: "{{ wireguard_config_dest }}"
        dest: "{{ wireguard_config_dest }}.bak.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      failed_when: false
      register: backup_result

    - name: Deploy WireGuard configuration
      ansible.builtin.copy:
        src: "{{ wireguard_config_src }}"
        dest: "{{ wireguard_config_dest }}"
        owner: root
        group: root
        mode: '0600'
      register: config_deployed

    - name: Enable WireGuard service
      ansible.builtin.systemd:
        name: "wg-quick@{{ wireguard_interface }}"
        enabled: true
        daemon_reload: true

    - name: Restart WireGuard if config changed
      ansible.builtin.systemd:
        name: "wg-quick@{{ wireguard_interface }}"
        state: restarted
      when: config_deployed.changed

    - name: Ensure WireGuard is running
      ansible.builtin.systemd:
        name: "wg-quick@{{ wireguard_interface }}"
        state: started

  post_tasks:
    - name: Wait for WireGuard interface
      ansible.builtin.wait_for:
        timeout: 5

    - name: Verify WireGuard interface status
      ansible.builtin.command: wg show {{ wireguard_interface }}
      register: wg_status
      changed_when: false

    - name: Display WireGuard status
      ansible.builtin.debug:
        msg: |
          WireGuard deployment complete:

          {{ wg_status.stdout }}

  tags:
    - wireguard
    - vpn
