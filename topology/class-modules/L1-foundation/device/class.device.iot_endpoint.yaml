@class: class.device.iot_endpoint
@title: IoT Endpoint Device
@description: |
  L1 physical representation of network-connected IoT device.
  Network attachment properties (VLAN, IP, connection type) are at L2
  via provides_ref link to class.network.iot_interface.
  Refactored per ADR 0117 for clean layer separation.
@layer: L1
@version: 2.0.0

properties:
  required:
    - device_name
    - device_type
  optional:
    - manufacturer
    - model
    - secrets_ref
    - provides_ref
    - firmware_ref
    - os_refs
    - hardware
    - connectivity
    - notes

property_schemas:
  device_name:
    type: string
    description: Human-readable device name
  device_type:
    type: string
    enum:
      - smart_tv
      - smart_speaker
      - ip_camera
      - smart_display
      - streaming_device
      - game_console
      - iot_hub
      - e_reader
      - smartphone
      - tablet
      - other
    description: Type of IoT device
  manufacturer:
    type: string
    description: Device manufacturer
  model:
    type: string
    description: Device model
  secrets_ref:
    type: string
    format: secrets_ref
    description: Reference to secrets file containing MAC address and device identifiers
  provides_ref:
    type: string
    format: instance_ref
    target_class: class.network.iot_interface
    description: Reference to L2 network interface instance this device provides
  firmware_ref:
    type: string
    format: instance_ref
    description: Reference to firmware instance
  os_refs:
    type: array
    items:
      type: string
      format: instance_ref
    description: References to OS instances
  hardware:
    type: object
    description: Physical hardware specifications (display, CPU, RAM, storage, etc.)
  connectivity:
    type: object
    description: Physical connectivity capabilities (wifi bands, bluetooth version, etc.)

required_capabilities: []

optional_capabilities: []

enabled_capabilities: []
