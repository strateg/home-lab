@object: obj.network.trust_zone.vpn_tunnel
@extends: class.network.trust_zone
@title: VPN Tunnel Trust Zone
@description: |
  Trust zone for devices routed through VPN tunnels.
  Multiple VLANs can use this zone with different tunnel endpoints.
  Traffic is isolated from local networks but has full internet access via VPN.
@version: 1.0.0

# Shared by inst.trust_zone.vpn_tunnel and inst.trust_zone.vpn_exit, which differ
# in security level, isolation and identity. Only the reusable shape of a VPN
# tunnel zone lives here; each zone classifies itself on its own instance.
properties:
  reserved: false
  # Allow outbound to untrusted (internet via VPN)
  allowed_outbound:
    - to:untrusted
  # Only established/related inbound
  allowed_inbound:
    - established

enabled_capabilities: []
