@object: obj.network.wireguard_tunnel
@extends: class.network.tunnel_link
@title: WireGuard Site-to-Site Tunnel
@description: |
  WireGuard point-to-point tunnel for site-to-site connectivity.
  Provides encrypted L3 overlay between two endpoints with automatic
  key exchange and minimal configuration overhead.
@version: 1.0.0

# Fixed properties for WireGuard
tunnel_type: wireguard
encapsulation: udp
encryption: chacha20_poly1305
mtu: 1420
keepalive_interval: 25
topology: point_to_point

# WireGuard-specific configuration schema
wireguard_config:
  listen_port:
    type: integer
    minimum: 1024
    maximum: 65535
    default: 51820
    description: UDP port for WireGuard listener

  persistent_keepalive:
    type: integer
    minimum: 0
    maximum: 3600
    default: 25
    description: Keepalive interval for NAT traversal (0 = disabled)

# Instance schema for tunnel endpoints
instance_schema:
  required:
    - tunnel_name
    - endpoint_a
    - endpoint_b
    - tunnel_network
  properties:
    tunnel_name:
      type: string
      pattern: "^wg[0-9]+$"
      description: Interface name (e.g., wg0, wg1)

    endpoint_a:
      type: object
      description: First tunnel endpoint (typically initiator/client side)
      required:
        - device_ref
        - role
        - tunnel_ip
      properties:
        device_ref:
          type: string
          format: instance_ref
          description: Reference to device instance
        role:
          type: string
          enum: [server, client, peer]
          description: WireGuard role on this endpoint
        tunnel_ip:
          type: string
          format: ipv4_cidr
          description: IP address on tunnel interface
        listen_port:
          type: integer
          description: UDP listen port (required for server role)
        public_endpoint:
          type: string
          description: Public IP or hostname for incoming connections
        allowed_ips:
          type: array
          items:
            type: string
            format: ipv4_cidr
          description: Networks routed through this peer

    endpoint_b:
      type: object
      description: Second tunnel endpoint (typically responder/server side)
      required:
        - device_ref
        - role
        - tunnel_ip
      properties:
        device_ref:
          type: string
          format: instance_ref
        role:
          type: string
          enum: [server, client, peer]
        tunnel_ip:
          type: string
          format: ipv4_cidr
        listen_port:
          type: integer
        public_endpoint:
          type: string
        allowed_ips:
          type: array
          items:
            type: string
            format: ipv4_cidr

    tunnel_network:
      type: string
      format: ipv4_cidr
      description: Tunnel subnet (e.g., 10.100.0.0/30)

    road_warrior_peers:
      type: array
      description: Mobile/road-warrior clients connecting to VPS hub
      items:
        type: object
        required:
          - device_ref
          - tunnel_ip
        properties:
          device_ref:
            type: string
            format: instance_ref
            description: Reference to device instance (phone, laptop, travel router)
          tunnel_ip:
            type: string
            format: ipv4_cidr
            description: IP address on tunnel interface
          routes:
            type: array
            items:
              type: string
              format: ipv4_cidr
            description: Networks this client should route through VPN
          dns:
            type: string
            format: ipv4
            description: |
              Resolver pushed to the client. Only set this when the address
              is reachable THROUGH the tunnel and the client has no resolver
              of its own; a gateway peer that already runs DNS for its LAN
              must omit it, otherwise every lookup on that LAN breaks
              whenever the tunnel is down or the resolver is unreachable.
              Omitted -> no DNS line is emitted.
          persistent_keepalive:
            type: integer
            default: 25
            description: Keepalive for mobile connections behind NAT
          gateway_for:
            type: array
            items:
              type: string
              format: instance_ref
            description: |
              Device instances that reach the tunnel THROUGH this peer
              instead of holding their own keys. Only valid when the peer is
              itself a router that masquerades its LAN into the tunnel, so
              the hub still sees a single /32. Documentation-only: no
              separate peer is generated.

    routing:
      type: object
      description: Routing configuration for tunnel
      properties:
        propagate_routes:
          type: boolean
          default: true
        route_all_traffic:
          type: boolean
          default: false
        allowed_networks:
          type: array
          items:
            type: string
            format: ipv4_cidr

enabled_capabilities:
  - cap.net.overlay.vpn.wireguard.server
  - cap.net.overlay.vpn.wireguard.client

vendor_capabilities: []

use_cases:
  - Site-to-site VPN between home router and cloud VPS
  - Secure tunnel for remote network access
  - Integration of cloud resources into home network
  - Bypass NAT/CGNAT for incoming connections via VPS relay
