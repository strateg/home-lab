@object: obj.network.vlan.servers
@extends: class.network.vlan
@title: Network Vlan Servers
@description: Intranet services network accessible via WireGuard tunnel (VLAN 100)
@version: 1.1.0

properties:
  # ADR-0110: Canonical CIDR — all derived host IPs (vlan_ref + host) compute from this base.
  # VLAN 100 for intranet services accessible via WireGuard tunnel.
  vlan_id: 100
  cidr: 10.0.100.0/24
  gateway: 10.0.100.1
  mtu: 1500
  dhcp_enabled: false
  dns_servers:
    - 192.168.88.1

enabled_capabilities:
  - cap.vlan.tagged
