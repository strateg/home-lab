@object: obj.network.security_matrix.soho
@extends: class.network.security_matrix
@title: SOHO Perimeter Security Matrix
@description: |
  Standard perimeter security matrix for SOHO networks.
  Manages inter-VLAN routing and firewall policies on the edge router.
  Based on 6-zone architecture from ADR-0109.
@version: 1.0.0

name: soho-perimeter
enforcement_plane: perimeter

# Standard SOHO zone references (resolved to instances per project)
zone_refs:
  - obj.network.trust_zone.untrusted
  - obj.network.trust_zone.guest
  - obj.network.trust_zone.iot
  - obj.network.trust_zone.vpn_tunnel
  - obj.network.trust_zone.user
  - obj.network.trust_zone.servers
  - obj.network.trust_zone.management

defaults:
  dns_servers: [1.1.1.1, 8.8.8.8]
  mtu: 1500
  dhcp_lease_time: "30m"

# Standard SOHO policy overrides (exceptions to implicit matrix rules)
# Override user→servers: partial access by port (R6 overrides R4 uphill default)
# No policy_overrides here, deliberately. This object used to carry
# `user-to-servers-http` (tcp 80,443) for the user -> servers pair.
#
# Removed 2026-10-11. A matrix resolves at most one override per zone pair -
# `_find_policy_override` returns the first match - so an override on a shared
# object competes with every instance that declares one for the same pair, and
# one of the two is silently discarded. Measured on the two instances extending
# this object: rtr-mikrotik-chateau ended up enforcing only its own db ports
# (5432,6379) with this permit gone, while rtr-slate ended up enforcing only
# this permit with its own db ports gone. Same authoring shape, opposite
# outcomes, and nothing reported either loss.
#
# That is also what ADR 0118 D7 warns about directly: an object supplies
# reusable shape and defaults, and must not author a value that decides one
# concrete entity's policy - it serves many instances and can hold only one
# such value. A zone-pair permit is exactly that kind of value.
#
# Each instance now declares the permits it means for this pair, which is
# behaviour-preserving for the live perimeter and visible to review. E7065
# refuses a pair claimed twice so this cannot silently return.
policy_overrides: []
