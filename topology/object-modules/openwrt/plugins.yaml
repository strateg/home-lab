schema_version: 1
plugins:
  - id: object.openwrt.compiler.zones
    kind: compiler
    entry: plugins/compilers/zones_compiler.py:OpenwrtZonesCompiler
    api_version: 1.x
    stages:
      - compile
    phase: finalize
    order: 80
    migration_mode: migrated
    depends_on:
      - base.compiler.effective_model
      - base.compiler.security_matrix
    timeout: 30
    execution_mode: subinterpreter
    consumes:
      # The composed R1-R6 plan per enforcer, already validated and composed
      # across every scope that names it. Required: this compiler derives no
      # substitute, and an absent channel must block rather than render an
      # empty zone set that reports success.
      - key: composed_matrices_by_enforcer
        from_plugin: base.compiler.security_matrix
        required: true
      # Device and network instance rows: segment ownership (managed_by_ref)
      # and the capabilities that identify an OpenWrt network enforcer.
      - key: effective_model_candidate
        from_plugin: base.compiler.effective_model
        required: true
      # Enforcer type resolved by the capability engine (ADR 0118/0119
      # D-TYPE-1). Used instead of the adapter capability, which is not
      # registered until the generator exists - see the plugin docstring.
      - key: enforcer_resolution
        from_plugin: base.compiler.effective_model
        required: true
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    produces:
      - key: openwrt_zones
        scope: pipeline_shared
    description: >-
      Lowers composed security matrices into OpenWrt firewall4 zone intent:
      per-zone input/forward policy with explicit input services, the
      forwardings to emit, and the denied pairs recorded as absent forwardings.
      Denials are not rules on this backend - zone chains are terminal and the
      base chains carry policy drop - so no terminal drop-all is produced.

  - id: object.openwrt.compiler.interfaces
    kind: compiler
    entry: plugins/compilers/interfaces_compiler.py:OpenwrtInterfacesCompiler
    api_version: 1.x
    stages:
      - compile
    phase: finalize
    order: 81
    migration_mode: migrated
    depends_on:
      - object.openwrt.compiler.zones
    timeout: 30
    execution_mode: subinterpreter
    consumes:
      # Required: the zone plan is the single producer of every segment's uci
      # section name, and firewall_zone.network references those same strings.
      # Re-deriving them here would let the two plans disagree about what a
      # section is called while both looked correct.
      - key: openwrt_zones
        from_plugin: object.openwrt.compiler.zones
        required: true
      # Wireless intent, tunnel addresses and keepalives are not in the zone
      # plan - it carries only what zone membership needs.
      - key: effective_model_candidate
        from_plugin: base.compiler.effective_model
        required: true
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    produces:
      - key: openwrt_interfaces
        scope: pipeline_shared
    description: >-
      Lowers runtime_intent onto the uapi resource surface: network interfaces
      and bridge devices, radios and wifi-ifaces, and DHCP pools. Does the
      arithmetic the schema forces rather than leaving it to a template - a CIDR
      split into list ipaddrs plus scalar netmask, channel auto rendered as the
      0 that netifd treats identically because the attribute is typed Number,
      and a dhcp_range lowered to start plus limit because uapi_dhcp_server has
      no end. E9911 refuses a pool that cannot be expressed that way; E9912
      refuses a wifi-iface whose network names no rendered section; W9902
      reports a client segment advertising more MTU than its egress tunnel
      carries. WireGuard peers are deferred, not silently absent.

  - id: object.openwrt.validator_json.zone_plan
    kind: validator_json
    entry: plugins/validators/zone_plan_validator.py:OpenwrtZonePlanValidator
    api_version: "1.x"
    stages: [validate]
    phase: run
    order: 150
    migration_mode: migrated
    depends_on:
      - object.openwrt.compiler.zones
    timeout: 30
    execution_mode: subinterpreter
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    consumes:
      # Optional on purpose: a project with no OpenWrt enforcer never produces
      # this channel, and its absence is not a defect. Present-but-wrong is
      # what this validator exists to catch.
      - from_plugin: object.openwrt.compiler.zones
        key: openwrt_zones
        required: false
    description: >-
      Refuses a lowered zone plan that contradicts its matrix. E9906: a pair the
      matrix denied must not appear among the forwardings to emit, since on
      firewall4 a denial is an omission and an emitted forwarding for a denied
      pair is an open path with no rule able to override it. E9907: a zone's
      input policy must be explicit and must not be ACCEPT, which stock OpenWrt
      ships for the LAN zone and which publishes SSH and the uapi endpoint to
      that zone's clients.

  - id: object.openwrt.validator_json.rule_plan
    kind: validator_json
    entry: plugins/validators/rule_plan_validator.py:OpenwrtRulePlanValidator
    api_version: "1.x"
    stages: [validate]
    phase: run
    order: 153
    migration_mode: migrated
    depends_on:
      - object.openwrt.compiler.zones
    timeout: 30
    execution_mode: subinterpreter
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    consumes:
      # Optional on purpose, as for the zone_plan validator: a project with no
      # OpenWrt enforcer never produces this channel.
      - from_plugin: object.openwrt.compiler.zones
        key: openwrt_zones
        required: false
    description: >-
      Refuses a lowered firewall_rule plan that cannot render into a chain whose
      meaning is order-independent. E9902: two match tuples in one chain must not
      overlap, because uapi exposes no ordering control and Terraform applies in
      parallel - overlapping tuples are either contradictory, making enforcement
      depend on an order nothing specifies, or identical, making two resources
      claim one uci section. Prefixes are compared as networks, not as strings.
      E9903: each field must carry the arity it renders at - zone endpoints are
      strings while ports and prefixes are lists - because fw4 drops a section
      with the wrong arity silently while Terraform reports success, and because
      the renderer iterates what it is given, turning a bare "80" into ["8","0"].

  - id: object.openwrt.generator.terraform
    kind: generator
    entry: plugins/generators/terraform_openwrt_generator.py:TerraformOpenwrtGenerator
    api_version: 1.x
    stages:
      - generate
    phase: run
    order: 230
    migration_mode: migrated
    depends_on:
      - object.openwrt.compiler.zones
      - object.openwrt.compiler.interfaces
    timeout: 30
    execution_mode: subinterpreter
    consumes:
      # Required: this generator derives no substitute for the lowered plan, so
      # an absent channel must block rather than render an empty Terraform root
      # and report success.
      - key: openwrt_zones
        from_plugin: object.openwrt.compiler.zones
        required: true
      # Optional on purpose: the firewall graph is renderable on its own, so a
      # project whose interface intent is not authored yet gets its zones rather
      # than nothing at all.
      - key: openwrt_interfaces
        from_plugin: object.openwrt.compiler.interfaces
        required: false
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    produces:
      - key: generated_dir
        scope: pipeline_shared
      - key: generated_files
        scope: pipeline_shared
      - key: terraform_openwrt_files
        scope: pipeline_shared
      - key: artifact_plan
        scope: pipeline_shared
      - key: artifact_generation_report
        scope: pipeline_shared
      - key: artifact_contract_files
        scope: pipeline_shared
    description: >-
      Renders provider wiring and the firewall zone graph for an OpenWrt
      enforcer into generated/<project>/terraform/openwrt/. Emits no terminal
      drop-all and no deny rules: zone chains are terminal and the base chains
      carry policy drop, so a denied pair is the absence of a forwarding. Counts
      what it deliberately did not render - remote-destination and port-scoped
      permits - in I9903 rather than dropping them silently.

  - id: object.openwrt.validator_json.interfaces
    kind: validator_json
    entry: plugins/validators/interfaces_validator.py:OpenwrtInterfacesValidator
    api_version: "1.x"
    stages: [validate]
    phase: run
    order: 152
    migration_mode: migrated
    depends_on:
      - object.openwrt.compiler.zones
    timeout: 30
    execution_mode: subinterpreter
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    consumes:
      - from_plugin: base.compiler.effective_model
        key: effective_model_candidate
        required: false
      - from_plugin: object.openwrt.compiler.zones
        key: openwrt_zones
        required: false
    description: >-
      E9905: every declared interface must land in exactly one rendered zone.
      uapi_firewall_zone has no device or subnet field, so an interface named in
      no zone is silently unreachable rather than open - caught for a missing
      trust_zone_ref, a zone the matrix does not carry, and the same interface
      claimed twice. E9904: the management path must be protected from the plan
      applied over it - exactly one interface declares it carries the uapi
      endpoint, that interface is immutable, and its zone keeps a service
      reachable, since every zone defaults to input REJECT and an apply that
      forgets this locks the operator out of the device.

  - id: object.openwrt.validator_json.wireless
    kind: validator_json
    entry: plugins/validators/wireless_validator.py:OpenwrtWirelessValidator
    api_version: "1.x"
    stages: [validate]
    phase: run
    order: 151
    migration_mode: migrated
    depends_on:
      - base.validator.references
    timeout: 30
    execution_mode: subinterpreter
    config: {}
    config_schema:
      type: object
      properties: {}
      required: []
    consumes:
      - from_plugin: base.compiler.effective_model
        key: effective_model_candidate
        required: false
    description: >-
      Refuses wireless intent that netifd or the regulatory database would
      silently defeat. E9908: a 5 GHz AP with no country never beacons, because
      regdomain 00 is NO-IR across all 5 GHz. W9904: a channel declared on a
      station-bearing radio is not honoured - netifd passes an empty frequency
      for mode=sta - so the declaration misleads review; it replaces the
      withdrawn E9909, which named the opposite consequence.
      E9910: two station interfaces on one radio violate the phy's
      '#{ managed } <= 1' and are the real cause of the upstream "Device is not
      active" reports. W9901: an AP sharing a radio with a station will not
      beacon until the station associates and is stopped on every scan or roam.
