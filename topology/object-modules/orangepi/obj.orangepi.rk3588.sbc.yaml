@object: obj.orangepi.rk3588.sbc
@extends: class.compute.edge_node
@title: Orangepi RK3588 SBC
@version: 2.0.0

model: Orange Pi 5 (RK3588S) ARM64 SBC
vendor: orangepi
hardware_specs:
  interfaces:
    ethernet:
    - name: end1
      role: trunk_uplink
      speed_mbps: 1000
      standard: gbe
      duplex: full
      status: degraded
      description: >-
        Onboard RTL8211F GbE (platform fe1c0000.ethernet, rk_gmac-dwmac driver).
        Named end1 by the Armbian rk35xx vendor kernel. Currently non-functional
        due to PHY initialization failure (Cannot attach to PHY error -19).
    - name: enx00e04c680347
      role: trunk_uplink
      speed_mbps: 1000
      standard: gbe
      duplex: full
      removable: true
      description: >-
        USB 3.0 Gigabit Ethernet adapter (Realtek RTL8153). Used as primary
        network interface while onboard end1 PHY is non-functional.
        Interface name derived from MAC address (predictable naming).
software_contract:
  firmware_obj_ref: obj.firmware.uboot.generic.arm64
  os_obj_refs:
  - obj.os.armbian.26.5.arm64.edge
  - obj.os.ubuntu.24.10.arm64.desktop
  os_cardinality:
    min: 1
    max: 2
  multi_boot: true

# OS installation is operator-driven: the Armbian image is written to media by
# hand and armbian-install moves it to NVMe and flashes the SPI bootloader.
# There is no unattended path and no cloud-init on the image, so no bootstrap
# artifacts are generated for this object.
initialization_contract:
  version: 2.0.0
  mechanism: manual
  requirements:
  - type: artifact
    name: armbian_image
    required: true
    description: Armbian image for board orangepi5 (rockchip-rk3588, arm64) obtained and verified by the operator.
  - type: tool
    name: armbian-install
    required: true
    description: Run on the target to move the rootfs to NVMe and flash the SPI NOR bootloader.
  - type: network
    name: first_boot_dhcp
    required: true
    description: First-boot network must provide DHCP or equivalent static bootstrap reachability.
  handover:
    checks:
    - type: ssh_reachable
      target: '{{ node.management_ip }}'
      port: 22
    retry:
      max_attempts: 8
      backoff_seconds: 20
      timeout_seconds: 600
  post_handover:
    owner: operator
    notes: >-
      Hand over to configuration management once SSH is reachable; ongoing
      configuration is Ansible-driven per ADR 0105.

enabled_capabilities:
- cap.compute.node.edge
- cap.compute.runtime.container_host
- cap.compute.workload.linux_base

vendor_capabilities:
- vendor.arm64.rk3588.sbc
- vendor.runtime.docker.host

# ============================================================================
# OPERATIONS CAPABILITIES (ADR 0105)
# Capabilities for backup, deploy, verify operations
# ============================================================================

operations_capabilities:
  - cap.operations.backup.config_archive      # Config archive backup (tar/gzip)
  - cap.operations.deploy.pre_check           # Pre-deploy verification
  - cap.operations.deploy.post_verify         # Post-deploy verification
  - cap.operations.snapshot.propagate         # Snapshot SHA in systemd unit
