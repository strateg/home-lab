@object: obj.oracle.cloud_vm
@extends: class.compute.workload.vm
@title: Oracle Cloud VM
@version: 1.1.0

model: Oracle Cloud VM
vendor: oracle
software_contract:
  firmware_obj_ref: obj.firmware.uefi.generic.arm64
  # OCI Always Free offers both Ampere A1 (arm64) and E2.1.Micro (x86_64) shapes,
  # so this allow-list must admit both architectures.
  os_obj_refs:
  - obj.os.linux.generic.arm64
  - obj.os.ubuntu.24.04.x86_64.cloud
  os_cardinality:
    min: 1
    max: 1
  multi_boot: false
enabled_capabilities:
- cap.compute.node.cloud_vm
- cap.compute.workload.linux_base
vendor_capabilities:
- vendor.cloud.vm.instance
- vendor.cloud.provider.oracle
