  - id: object.mikrotik.generator.terraform
    kind: generator
    entry: plugins/generators/terraform_mikrotik_generator.py:TerraformMikroTikGenerator
    api_version: 1.x
    stages:
      - generate
    phase: run
    order: 220
    migration_mode: migrated
    depends_on:
      - base.compiler.security_matrix
      - object.mikrotik.compiler.capability_flags
      - object.mikrotik.compiler.wireguard_tunnels
      - object.mikrotik.compiler.containers
      - object.mikrotik.compiler.wifi_config
      - object.mikrotik.compiler.routing_policies
      - object.mikrotik.compiler.mac_vlan_assignments
      - object.mikrotik.compiler.bridge_vlans
      - object.mikrotik.compiler.vlan_entries
    timeout: 30
    execution_mode: subinterpreter
    consumes:
      # Zone membership and address-domain CIDRs, derived once in the core
      # (A24 / W05). Required: the projection derives no substitute, so an absent
      # channel must block generation rather than render empty address lists and
      # empty tunnel routes while reporting success. The kernel raises E8003.
      #
      # composed_matrices_by_enforcer replaces security_matrices here (ADR
      # 0118-analysis/ENFORCER-SCOPE-IMPLEMENTATION-READINESS.md sections
      # 5c/5d, N-07): the compiler's already-validated, already-computed
      # R1-R6 matrix per enforcer, composed across every scope it holds. The
      # projection used to re-derive R1-R6 itself from raw network_rows, a
      # third derivation of the same fact; it now only resolves
      # src_vlan_ref/dst_vlan_ref addresses, which the compiler does not own.
      - key: composed_matrices_by_enforcer
        from_plugin: base.compiler.security_matrix
        required: true
      - key: vlan_cidr_map
        from_plugin: base.compiler.security_matrix
        required: true
      # W07 migration order item 1: conditional-generation booleans, derived
      # once at compile stage. The projection derives no substitute, so an
      # absent channel must block generation the same way the two above do.
      - key: capability_flags
        from_plugin: object.mikrotik.compiler.capability_flags
        required: true
      # W07 migration order item 4a: WireGuard tunnel/interface/peer shape,
      # derived once at compile stage. The projection derives no substitute.
      - key: wireguard_tunnels
        from_plugin: object.mikrotik.compiler.wireguard_tunnels
        required: true
      # W07 migration order item 4b: container attachment/publication shape,
      # derived once at compile stage. The projection derives no substitute.
      - key: containers
        from_plugin: object.mikrotik.compiler.containers
        required: true
      # W07 migration order item 4c: WiFi interface/VLAN membership shape,
      # derived once at compile stage. The projection derives no substitute.
      - key: wifi_config
        from_plugin: object.mikrotik.compiler.wifi_config
        required: true
      # W07 migration order item 4d: policy-based routing shape, derived
      # once at compile stage. The projection derives no substitute.
      - key: routing_policies
        from_plugin: object.mikrotik.compiler.routing_policies
        required: true
      # W07 migration order item 4e: MAC-to-VLAN assignment shape, derived
      # once at compile stage. The projection derives no substitute.
      - key: mac_vlan_assignments
        from_plugin: object.mikrotik.compiler.mac_vlan_assignments
        required: true
      # W07 migration order item 4f: bridge-VLAN membership shape, derived
      # once at compile stage. The projection derives no substitute.
      - key: bridge_vlans
        from_plugin: object.mikrotik.compiler.bridge_vlans
        required: true
      # W07 migration order item 4g: VLAN row -> rendered shape, derived
      # once at compile stage. The projection derives no substitute.
      - key: vlans
        from_plugin: object.mikrotik.compiler.vlan_entries
        required: true
    config:
      terraform_version: '>= 1.6.0'
      mikrotik_provider_source: terraform-routeros/routeros
      mikrotik_provider_version: ~> 1.40
      mikrotik_api_host: ''
      mikrotik_host: ''
      artifact_obsolete_action: warn
      terraform_remote_state:
        enabled: false
        backend: ''
        config: {}
      capability_templates:
        qos:
          enabled_by: capabilities.has_qos
          template: terraform/qos.tf.j2
          output: qos.tf
        wireguard:
          enabled_by: capabilities.has_wireguard
          template: terraform/vpn.tf.j2
          output: vpn.tf
        containers:
          enabled_by: capabilities.has_containers
          template: terraform/containers.tf.j2
          output: containers.tf
    config_schema:
      type: object
      properties:
        terraform_version:
          type: string
          description: Terraform CLI version constraint for provider block.
        mikrotik_provider_source:
          type: string
          description: Terraform provider source address for RouterOS provider.
        mikrotik_provider_version:
          type: string
          description: Terraform provider version constraint for RouterOS provider.
        mikrotik_api_host:
          type: string
          description: Optional full RouterOS API endpoint URL override.
        mikrotik_host:
          type: string
          description: Legacy alias for mikrotik_api_host (kept for compatibility).
        artifact_obsolete_action:
          type: string
          enum:
            - retain
            - delete
            - warn
          default: warn
          description: Action for stale files under generator output root (ADR0093
            safe obsolete protocol).
        terraform_remote_state:
          type: object
          description: Optional Terraform backend.tf generation for remote state.
          properties:
            enabled:
              type: boolean
              default: false
            backend:
              type: string
              description: Backend type (for example s3, pg, consul, http).
            config:
              type: object
              description: Backend key-value settings rendered into backend block.
              additionalProperties: true
          required: []
        capability_templates:
          type: object
          description: Capability-driven template mappings for conditional artifact
            generation.
          additionalProperties:
            type: object
            properties:
              enabled_by:
                type: string
                description: Capability expression evaluated against projection capabilities.
              template:
                type: string
                description: Template path relative to object template root.
              output:
                type: string
                description: Output filename for generated artifact.
            required:
              - enabled_by
              - template
              - output
      required: []
    produces:
      - key: generated_dir
        scope: pipeline_shared
      - key: generated_files
        scope: pipeline_shared
      - key: terraform_mikrotik_files
        scope: pipeline_shared
      - key: artifact_plan
        scope: pipeline_shared
      - key: artifact_generation_report
        scope: pipeline_shared
      - key: artifact_contract_files
        scope: pipeline_shared
    description: Emits baseline Terraform artifacts for MikroTik from v5 projections
      (Phase 4 bootstrap).
  - id: object.mikrotik.generator.bootstrap
    kind: generator
    entry: plugins/generators/bootstrap_mikrotik_generator.py:BootstrapMikroTikGenerator
    api_version: 1.x
    stages:
      - generate
    phase: run
    order: 320
    migration_mode: migrated
    depends_on: []
    timeout: 30
    execution_mode: subinterpreter
    config:
      artifact_obsolete_action: warn
      bootstrap_files:
        - output_file: init-terraform.rsc
          template: bootstrap/init-terraform.rsc.j2
        - output_file: backup-restore-overrides.rsc
          template: bootstrap/backup-restore-overrides.rsc.j2
        - output_file: terraform.tfvars.example
          template: bootstrap/terraform.tfvars.example.j2
        - output_file: README.md
          template: bootstrap/readme.md.j2
    config_schema:
      type: object
      properties:
        artifact_obsolete_action:
          type: string
          enum:
            - retain
            - delete
            - warn
          default: warn
          description: Action for stale files under generator output root (ADR0093
            safe obsolete protocol).
        bootstrap_files:
          type: array
          description: Bootstrap file mappings for node root directory.
          items:
            type: object
            properties:
              output_file:
                type: string
                description: Output filename relative to node root.
              template:
                type: string
                description: Template path relative to object template root.
            required:
              - output_file
              - template
      required: []
    produces:
      - key: generated_dir
        scope: pipeline_shared
      - key: generated_files
        scope: pipeline_shared
      - key: bootstrap_mikrotik_files
        scope: pipeline_shared
      - key: artifact_plan
        scope: pipeline_shared
      - key: artifact_generation_report
        scope: pipeline_shared
      - key: artifact_contract_files
        scope: pipeline_shared
    description: Emits baseline bootstrap artifacts for MikroTik routers (Phase 6
      bootstrap).
